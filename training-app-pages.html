01310 (start from knees) + side plank 2\xD730s/side","METCON (Z4, ~7 min): 7-min AMRAP \u2014 10 cal bike, 10 push-up, 10 sit-up"]},3:{name:"Z2 RUN (easy!) + short Z5 kicker",items:["Z2 run 25\u201335 min \u2014 KEEP IT EASY, nose-breathing pace, run/walk if HR climbs. This is the race-engine day AND the stress-lowering day.","Z5 kicker (~4 min): 4 \xD7 20s stride/sprint, 40s walk"]},4:{name:"Spartan metcon (Z4/5)",items:["~15\u201320 min, e.g. 3 RFT: 400m run, 12 DB thrusters, 12 heavy KB swing, 40m sandbag/farmer carry, 9 burpees. Rotate carries weekly (farmer / sandbag / bucket).","CORE (optional, carries already cover it): hollow hold 3\xD720\u201330s if gas remains \u2014 skip guilt-free"]},5:{name:"Full-body strength + sprint metcon (Z5)",items:["Power clean 5\xD73 (mod-heavy)","Push press 4\xD76 (RPE 8)","Front squat / FR lunge 3\xD78","METCON (Z5, ~8 min): 8 \xD7 20s hard / 40s easy \u2014 alternate bike and running weekly; hills when possible","CORE (~5 min): Pallof press 3\xD710/side (anti-rotation)","Cool-down: 5 min easy breathing pace"]}};var XA={1:{name:"LOWER A (quad emphasis) + sprint finisher",items:["Back squat 4\xD78 (RIR 2)","Quad volume \u2014 PICK ONE: leg press 3\xD712  |  FREE WEIGHT: heavy goblet squat 3\xD712","Walking lunge 3\xD712/leg","Quad isolation \u2014 PICK ONE: leg extension 3\xD715  |  FREE WEIGHT: reverse Nordic curl 3\xD710","Calves \u2014 PICK ONE: standing calf raise 4\xD715  |  FREE WEIGHT: DB standing calf raise off a plate 4\xD715","CORE: hanging knee raise 3\xD712","CONDITIONING FIRST (~7 min) \u2014 DEALER\'S CHOICE: bike, treadmill, shuttles, ski erg, or double unders. The only day with a free pick."]},2:{name:"UPPER A (horizontal push/pull) + intervals",items:["Bench 4\xD78 (RIR 2)","DB row 4\xD710/arm","Incline DB press 3\xD710","Chest isolation \u2014 PICK ONE: cable flye or pec deck 3\xD715  |  FREE WEIGHT: DB flye 3\xD715","Rear delt \u2014 PICK ONE: cable face pull 3\xD715  |  FREE WEIGHT: bent-over DB rear-delt raise 3\xD715","Arms \u2014 PICK ONE: triceps pushdown 3\xD712  |  FREE WEIGHT: DB overhead triceps extension 3\xD712. Then DB curl 3\xD712","Grip: dead hang 3\xD725-30s (accumulation, NOT max)","CONDITIONING FIRST (~9 min): TREADMILL 6 \xD7 60s hard / 90s easy. NO BIKE \u2014 the 4\xD74 benchmark is tomorrow. No row or ski erg either \u2014 they compete with lat and grip work. LOG belt speed + incline."]},3:{name:"CONDITIONING DAY \u2014 the cardio priority session",items:["10 min easy warm-up","MAIN SET: 4 \xD7 4 min HARD / 3 min easy. BIKE \u2014 tool is locked, do not swap. Nothing scheduled after this session.","8 min cool-down"]},4:{name:"LOWER B (hinge/glute emphasis) + intervals",items:["RDL 4\xD78 (barbell)","Barbell hip thrust 3\xD712  |  ALT: DB hip thrust or single-leg glute bridge 3\xD712/side","Bulgarian split squat 3\xD710/leg (DBs)","Hamstrings \u2014 HAM CURL MACHINE 3\xD715 preferred. The good morning is out of the default: this day already runs RDL, hip thrust and Bulgarian, and a fourth spine-loaded hinge is cost without benefit for a physique goal. Nordic ham curl 3\xD76 if no machine.","Calves \u2014 PICK ONE: seated calf raise 3\xD715  |  FREE WEIGHT: seated DB calf raise 3\xD715","Farmer carry 3\xD740m","CONDITIONING FIRST (~20 min): BIKE steady @ 142-152, cadence 85-95. STEADY, NOT INTERVALS \u2014 this lands the day after the 4\xD74 and is the second aerobic dose of the week. NOT row or ski erg: hinge-pattern conditioning in front of heavy RDLs loads the erectors first."]},5:{name:"UPPER B (vertical push/pull) + mixed finisher",items:["DB shoulder press 4\xD710","Vertical pull \u2014 PICK ONE: assisted pull-up 4\xD76 (RIR 2)  |  FREE WEIGHT: band-assisted pull-up 4\xD76, or eccentric-only pull-up 4\xD74 (5s lower)","Lat volume \u2014 PICK ONE: lat pulldown 3\xD712  |  FREE WEIGHT: DB pullover 3\xD712, or inverted row 3\xD710","Lateral raise 4\xD715 (DB)","Rear-delt flye 3\xD715 (DB)","Arms: skullcrusher 3\xD712 + hammer curl 3\xD712","CORE: toes-to-rig 3\xD710 + side plank 2\xD745s/side","CONDITIONING FIRST (~15 min): TREADMILL 5 \xD7 90s hard / 90s easy. Harder pace than Day 2 \u2014 nothing is measured after this one. Same belt speed every rep; if you fade by rep 3, shorten to 75s rather than slowing the belt."]},6:{name:"DAY 6 \u2014 easy aerobic + core (Z2 base)",items:[{note:"THE POINT OF THIS DAY IS THAT IT IS EASY. Everything else in the week sits at or above threshold; this is the only session that builds the aerobic base, and base work is what lowers resting heart rate. If you finish it feeling like you trained hard, it did not work."},"HR TARGET: 142-152 the whole session. Hold the band on every machine \u2014 slow down rather than push through.","Warm-up (6 min): treadmill walk 3.5, build to an easy jog.","BLOCK 1 \u2014 TREADMILL 10 min steady @ 142-152 (likely 5.0-5.5 mph).","  Core: hollow hold 3 \xD7 30s (30s rest) + side plank 2 \xD7 45s/side (20s rest).","BLOCK 2 \u2014 BIKE 10 min steady @ 142-152, cadence 85-95. Resistance does the work, not leg speed.","  Core: hanging knee raise 3 \xD7 12 (45s rest) + dead bug 3 \xD7 10/side (30s rest). Sub bear hold 3 \xD7 20s if the dead bug is not clicking.","BLOCK 3 \u2014 ROWER 8-10 min steady @ 142-152, stroke rate 20-22 spm. Legs drive, then hinge, then arms \u2014 that order every stroke. Rower over ski erg: more leg drive, easier to hold low intensity, and it is the same hinge/grip pattern so running both is redundant.","  Core: plank 2 \xD7 60s (45s rest) + side plank 2 \xD7 30s/side (20s rest).","Cool-down (5 min): easy walk until HR is under 120.",{note:"STOP RULES \u2014 any low-back tightness on the rower, move to the bike and finish there. If HR will not settle into the band on a machine, slow it down."},{note:"NO BONUS INTERVALS. Aug 23 ran this at 141 avg but peaked 170, which means some of it drifted above Z2. Adding hard work on top defeats the purpose of the day."}]}},Yy={2:{3:{name:"Z2 RUN (easy!) + short Z5 kicker \u2014 wk2",items:["Z2 run 30 min \u2014 KEEP IT EASY, target ~112\u2013130 bpm, nose-breathing. Your wk1 run held this well (129 avg) \u2014 repeat that discipline.","Z5 kicker \u2014 STRICT DOSE: 4 \xD7 20s genuinely fast (can't talk) / 40s walk. Only 4 rounds. Last time you ran this 10 min \u2014 don't. Short and sharp."]},4:{name:"Spartan metcon (Z4/5) \u2014 wk2 (MORE WORK + pace it)",items:["4 RFT (up from 3): 400m run, 12 DB thrusters @25#, 12 KB swing @35#, 40m farmer carry, 9 burpees. Don't forget the KB swings.","Pacing fix: rest 30\u201360s standing BETWEEN rounds \u2014 deliberate rest gives a FASTER time than grinding at 185 bpm. Goal: finish all 4 rounds.","This is where your extra energy goes \u2014 an added round on the hard day, not a hard Day 3.","CORE (optional): hollow hold 3\xD720\u201330s if gas remains"]},5:{name:"Full-body strength + sprint metcon \u2014 wk2 (add load)",items:["Power clean 5\xD73 \u2014 start at 125, build toward 135\u2013140 if moving well (last wk topped 135 at RPE 7).","Push press 4\xD76 \u2014 start working sets at 95\u2013105 (last wk topped 105). Add 5# if clean.","Front squat \u2192 FR lunge 3\xD76 \u2014 go up from 65 if last week felt easy; try 75\u201385.","METCON (Z5, ~8 min): 8 \xD7 20s hard / 40s easy \u2014 bike or run. DO THIS ONE \u2014 it's been skipped twice. If short on time, metcon BEFORE accessories.","CORE (~5 min): Pallof press 3\xD710/side","Cool-down: 5 min easy breathing pace"]}},3:{1:{name:"Lower strength + carries + metcon \u2014 wk3 (push load)",items:["Back squat 5\xD76 \u2014 work all sets at 155 (you hit 155 for a set at RPE 6 in wk2). If it's a clean 6, you're ready \u2014 add 5# next week.","RDL 4\xD78 \u2014 you topped 185 in wk2. Build to 195\u2013205 this week.","Walking lunge 3\xD712/leg @ 40# (up from 35).","Accessory: ham curls + DB curls 3\xD712\u201315 \u2014 DON'T skip these this week (missed both wk1 and the wk2 carryover).","Grip/carry: farmer carry 4\xD740m \u2014 you carried 53#/hand; go heavier if grip holds.","CORE (~5 min): hanging knee raise 3\xD712 + plank 3\xD745s","METCON (Z4, ~6 min): 6-min AMRAP \u2014 10 KB swing, 8 burpee, 12 air squat. Beat last week's 3 rounds."]},2:{name:"Upper strength + grip + metcon \u2014 wk3 (HOTEL GYM \xB7 DB/KB)",items:["Bench or DB press 5\xD76 \u2014 if no bench/barbell, do flat DB press at 115-equiv per-hand load (split it, e.g. ~50\u201355# DBs). Topped 115 barbell in wk2.","Pull-up \u2014 use the hotel pull-up bar if there is one (try true reps); if not, sub heavy DB single-arm rows 4\xD710/arm or DB pullovers.","DB row 4\xD710/arm @ 50 (up from 45) \u2014 travels fine.","Accessory (DB/KB \u2014 hotel gym): DB triceps ext + DB lateral raise + DB rear-delt flye, 3\xD712\u201315 (rear-delt flye replaces the face pull, same muscles, no cable needed).","Grip: dead hang 3\xD7 max off the pull-up bar \u2014 chase 35s+ (was 30/20/20). If no bar, sub heavy KB/DB farmer holds for time.","CORE (~5 min): ab-wheel if available, else KB/DB plank drag-through or hollow holds 3\xD720\u201330s + side plank 2\xD730s/side.","METCON (Z4, ~7 min): 7-min AMRAP \u2014 10 KB swing (sub for the bike if no cardio machine), 10 push-up, 10 sit-up. Beat 3 rounds."]},3:{name:"Z2 RUN (easy!) \u2014 wk3 \u2014 DISCIPLINE WEEK (treadmill floor)",items:["Pure cardio day \u2014 all on the treadmill floor, no weights needed. Treadmill 32 min. SET A PACE THAT KEEPS HR UNDER 130 and leave the belt there.","wk2 ran at 157 (zone 4) logged as 'easy' \u2014 the data said hard. This week it's a ~125 average or it doesn't count. Slow the belt if HR drifts over 130; walk if needed.","Z5 kicker \u2014 STRICT: 4 \xD7 20s fast / 40s walk on the treadmill. Four rounds only (you nailed this dose in wk2)."]},4:{name:"Spartan metcon \u2014 wk3 (HOTEL \xB7 rower version \xB7 TRAVEL-SCALED)",items:["Self-contained in the weight room \u2014 no floor-hopping. You're 4 nights into short sleep just off a bug, so scale INTENSITY to how you feel today, not to beating last week. Full rest between rounds. Log as travel/low-sleep session.","4 RFT: 12\u201315 cal row (engine piece, ~60\u201375s hard), 12 DB thrusters @30#, 12 KB swings @35\u201353#, suitcase hold 30\u201340s (KB/DB at sides \u2014 subs for the carry, no room needed), 9 burpees.","Row replaces the first KB block; second KB swing stays as the hinge. Suitcase hold replaces the 40m farmer carry.","Goal: get the work in clean, not a PR. Rest 30\u201360s between rounds.","CORE (optional): hollow hold 3\xD730s if gas remains"]},5:{name:"Full-body strength + sprint metcon \u2014 wk3 (HOTEL \xB7 DB/KB + treadmill OR bike)",items:["Strength (weight-room floor, DB/KB): If no barbell \u2014 DB clean 5\xD73 (heaviest available, explosive), DB push press 4\xD76, DB front-rack squat\u2192lunge 3\xD76. Match wk2 effort: cleans were 140 barbell, push press 125\xD74.","Then the METCON \u2014 two options depending on floors:","  Option A (weight room, no floor change): 10-min EMOM \u2014 alt 15 KB swings / 12 burpees. Keeps it Z5 without leaving the floor.","  Option B (cardio floor): finish strength, go to the bike/treadmill, do 10 \xD7 20s hard / 40s easy. You did 3 mi/8 min on a bike in wk2 \u2014 extend it.","CORE (~5 min): single-arm DB farmer carry 3\xD740m/side (swapped the Pallof \u2014 same anti-rotation, folds into carries, Spartan-relevant).","Cool-down: 5 min easy breathing pace."]}},4:{1:{name:"Lower strength + carries + metcon \u2014 wk4 (autoregulate)",items:["NOT a deload \u2014 normal build week. But you're coming off a bug + 5 nights of bad sleep, so FEEL OUT the first sets. If the squat moves great, push it. If you feel flat, that's the sleep debt \u2014 ease off. Let your body decide.","Back squat 5\xD76 @ 155 \u2014 if clean and strong, add 5#. If heavy/flat, hold or drop to 145.","RDL 4\xD78 @ 195 (you hit this in wk3).","Walking lunge 3\xD712/leg @ 40#.","Accessory: ham curls + DB curls 3\xD712\u201315.","Grip/carry: farmer carry 4\xD740m @ 62#/hand (or heavier if grip holds).","CORE: hanging knee raise 3\xD712 + plank 3\xD745s.","METCON (Z4, ~6 min): 6-min AMRAP \u2014 10 KB swing, 8 burpee, 12 air squat. Scale intensity to how you feel today."]},2:{name:"Upper strength + grip + metcon \u2014 wk4 (autoregulate)",items:["Feel out the first sets \u2014 push if strong, ease if flat.","Bench 5\xD76 @ 115\u2013120 (you topped 115 at RPE 6 in wk2/3).","Pull-up \u2014 reduce assistance / chase true reps (you got 2 unassisted on the road).","DB row 4\xD710/arm @ 50.","Accessory: triceps + lat raise + rear-delt flye 3\xD712\u201315.","Grip: dead hang 3\xD7 max \u2014 chase 35s+. (Watch the shoulders if they're still sore from travel thrusters \u2014 go easy on overhead if so.)","CORE: ab-wheel 3\xD710 + side plank 2\xD730s/side.","METCON (Z4, ~7 min): 7-min AMRAP \u2014 10 cal bike, 10 push-up, 10 sit-up. Beat 3\u20134 rounds; some full push-ups."]},3:{name:"Z2 RUN (easy!) \u2014 wk4",items:["Treadmill, 32 min. Hold HR under 130 \u2014 you proved you can with a 128 mile-1 in wk3. The whole run should feel like that mile. Govern by the watch, not the feeling.","If you feel good a mile in, that's the moment to HOLD the belt, not speed up.","Z5 kicker \u2014 STRICT: 4 \xD7 20s fast / 40s walk. Four rounds only."]},4:{name:"Spartan metcon \u2014 wk4 (full gym, back home)",items:["Back to your full gym \u2014 real running and carries available again. 4 RFT: 400m run, 12 DB thrusters @30#, 12 KB swing @35#, 40m farmer or sandbag carry, 9 burpees.","Rest 30\u201360s between rounds (this paced you well \u2014 beat 24:30 from the road version if you feel good).","This is your hard-intensity outlet. Push here, not on Day 3.","CORE (optional): hollow hold 3\xD730s."]},5:{name:"Full-body strength + sprint metcon \u2014 wk4 (the one you missed)",items:["This is the Day 5 you've skipped twice now \u2014 get it in. Full-body + sprints.","Power clean 5\xD73 @ 135\u2013140 (clean form, don't grind to failure like the 155 attempt).","Push press 4\xD76 @ 115\u2013120 (watch the shoulders).","Front squat \u2192 FR lunge 3\xD76 @ 85.","METCON (Z5, ~10 min): 10 \xD7 20s hard / 40s easy \u2014 bike or run. This is where extra gas goes.","CORE: single-arm farmer carry 3\xD740m/side (anti-rotation, Spartan-relevant).","Cool-down: 5 min easy breathing pace."]}},5:{1:{name:"Lower strength + carries + metcon \u2014 wk5 (PUSH strength, HOLD metcon)",items:[{note:"NOTE \u2014 Block 2 starts. Altitude rule: push the LIFTS (short, not oxygen-limited), keep the metcon CONTROLLED. Run the metcon by breathing, not heart rate \u2014 HR reads high up there and lies."},"Back squat 5\xD75 \u2014 you held 155 last week and it felt heavy on bad sleep. If it moves clean tomorrow, work at 160\u2013165. If heavy, stay 155. YOU decide by bar speed.","RDL 4\xD78 @ 195\u2013205.","Walking lunge 3\xD712/leg @ 44#.","Accessory: ham curls + DB curls 3\xD712\u201315.","Grip/carry: farmer carry 4\xD740m @ 62#+/hand.","CORE: hanging knee raise 3\xD712 + plank 3\xD745s.","METCON (controlled at altitude, ~6 min): 6-min AMRAP \u2014 10 KB swing, 8 burpee, 12 air squat. Talk-test pace \u2014 if you can't get a short sentence out, ease up."]},2:{name:"Upper strength + grip + metcon \u2014 wk5 (PUSH strength)",items:[{note:"NOTE \u2014 shoulders are finally good, so press with confidence. Push the strength here."},"Bench 5\xD75 \u2014 work at 120 (you did 115 clean at RPE 6). Try 125 on the last set if moving well.","Pull-up \u2014 chase true reps, reduce assistance. You got 2 unassisted on the road.","DB row 4\xD710/arm @ 50\u201355.","Accessory: triceps + lat raise + rear-delt flye 3\xD712\u201315.","Grip: dead hang 3\xD7 max \u2014 you hit 40s. Chase 45s.","CORE: ab-wheel 3\xD710 + side plank 2\xD730s/side.","METCON (controlled, ~7 min): 7-min AMRAP \u2014 10 cal bike, 10 push-up, 10 sit-up. Steady, not redline. Some full push-ups."]},3:{name:"Z2 RUN (easy!) \u2014 wk5 \u2014 altitude makes this EASY to get right",items:[{note:"NOTE \u2014 at altitude your easy pace gives more stimulus than at home, so this is the one day altitude helps for free. Keep it genuinely easy."},"Run 30\u201335 min. Govern by breathing (nose-breathing pace) since HR runs high up there \u2014 don't chase the 130 number, chase the easy feeling.","If you feel good, HOLD the pace, don't speed up.","Z5 kicker \u2014 STRICT: 4 \xD7 20s fast / 40s walk. Four rounds only. Skip it if you're still feeling the altitude."]},4:{name:"Spartan metcon \u2014 wk5 (CONTROLLED at altitude)",items:[{note:"NOTE \u2014 this is the day to NOT push hard at altitude. You ran wk4's version controlled with 2-min rests and it worked perfectly. Repeat that discipline."},"4 RFT: 400m run (or laps to ~400m), 12 DB thrusters @30#, 12 KB swing @35\u201344#, 40m carry, 9 burpees.","Rest 90s\u20132min between rounds. Longer rest = the intensity control. Beat wk4's time only if you genuinely feel good.","Talk-test between rounds. Gasping = too hard for altitude.","CORE (optional): hollow hold 3\xD730s."]},5:{name:"Full-body strength + sprint metcon \u2014 wk5 (SEA LEVEL \u2014 push the metcon!)",items:[{note:"NOTE \u2014 back in Dallas, rested. This is the GREEN LIGHT session. Push the lifts AND the metcon \u2014 HR numbers mean something again at sea level."},{note:"NOTE \u2014 coming off altitude, sea level may feel easy for a few days. Ride it on the metcon. But keep cleans crisp \u2014 feeling good \u2260 grind cleans to failure."},"Power clean 5\xD73 \u2014 CLEAN triples. Build to 140\u2013145 with crisp form. Stop a rep short.","Push press 4\xD76 @ 120\u2013125.","Front squat \u2192 FR lunge 3\xD76 @ 85\u201395.","METCON (~10 min): 10 \xD7 20s HARD / 40s easy \u2014 bike or run. Genuinely hard intervals this time \u2014 push into 160s-170s on the work. This is your outlet.","CORE: single-arm farmer carry 3\xD740m/side.","Cool-down: 5 min easy breathing."]}},6:{1:{name:"Lower strength + carries + metcon \u2014 wk6 (PUSH \u2014 first clean week)",items:[{note:"NOTE \u2014 first fully-recovered, undisrupted week in a while. This is where the strength block earns its keep. Push loads."},"Back squat 5\xD75 \u2014 you hit 185 (single) / 175 backoff at altitude. Work all sets at 175\u2013185 now that you're rested at sea level. Add 5# if bar speed is good.","RDL 4\xD78 @ 205\u2013215.","Walking lunge 3\xD712/leg @ 44#.","Accessory: ham curls + DB curls 3\xD712\u201315 \u2014 DON'T skip.","Grip/carry: farmer carry 4\xD740m @ 62#+/hand.","CORE (do NOT skip \u2014 dropped 3 wks running): hanging knee raise 3\xD712 + plank 3\xD745s.","METCON (~6 min): 6-min AMRAP \u2014 10 KB swing, 8 burpee, 12 air squat. Sea level \u2014 push it."]},2:{name:"Upper strength + grip + metcon \u2014 wk6 (PUSH + grip FIRST)",items:[{note:"NOTE \u2014 grip has been testing weak because you hang AFTER pull-ups/rows (fatigued). This week: do dead hangs EARLY, before the pulling work, so it's a real test."},"Grip FIRST (while fresh): dead hang 3\xD7 max \u2014 you hit 40s fresh should beat it. Target 45s+.","Bench 5\xD75 \u2014 you hit 135 last week. Work at 130\u2013135, try 140 on last set.","Weighted/strict pull-up \u2014 chase volume, reduce assistance (you're getting 4 unassisted).","DB row 4\xD710/arm @ 55.","Accessory: triceps + lat raise + rear-delt flye 3\xD712\u201315.","CORE: ab-wheel 3\xD710 + side plank 2\xD730s/side.","METCON (~7 min): 7-min AMRAP \u2014 10 cal bike, 10 push-up (full), 10 sit-up. Beat 3+ rounds."]},3:{name:"Z2 RUN (easy!) \u2014 wk6 \u2014 sea level, Z2 = 138-148",items:[{note:"NOTE \u2014 Z2 is 138\u2013148 bpm (your app's zones). At sea level you can finally trust the number. Hold it in the band."},"Run 32\u201335 min. Govern by HR \u2014 keep it 138\u2013148. If you feel great, HOLD pace, don't drift up.","Z5 kicker \u2014 STRICT: 4 \xD7 20s fast / 40s walk. Four rounds only."]},4:{name:"Spartan metcon \u2014 wk6 (SEA LEVEL \u2014 this is your hard day)",items:[{note:"NOTE \u2014 back at sea level, fully recovered. Unlike the altitude weeks, you can PUSH this one. This is your hard-intensity outlet."},"4 RFT: 400m run, 12 DB thrusters @30#, 12 KB swing @44#, 40m heavy farmer/sandbag carry, 9 burpees.","Rest 60\u201390s between rounds. Push the pace \u2014 beat your best 4-round time (~24:30). HR into 170s is fine today.","CORE: hollow hold 3\xD730s.",{note:"NOTE \u2014 this is the loaded-conditioning day. Bring it."}]},5:{name:"Full-body strength + sprint metcon \u2014 wk6 (PUSH both)",items:[{note:"NOTE \u2014 push lifts AND the sprint metcon. You hit clean 155 cleans last week \u2014 build on it."},"Power clean 5\xD73 \u2014 CLEAN triples at 150\u2013160. Crisp form, stop a rep short (no grinding).","Push press 4\xD76 @ 125\u2013135.","Front squat \u2192 FR lunge 3\xD76 @ 95\u2013105.","METCON (~10 min): 10 \xD7 20s HARD / 40s easy. Full 10 rounds this time \u2014 sea level, no excuses. Into 160s-170s.","CORE (the carries you owe from wk5): single-arm farmer carry 3\xD740m/side.","Cool-down: 5 min easy breathing."]}},7:{1:{name:"Lower strength + carries + metcon \u2014 wk7 (last hard week before deload)",items:[{note:"NOTE \u2014 Week 7 is the final push of Block 2; Week 8 is a deload (you've earned it after this). Squeeze the strength this week."},{note:"NOTE \u2014 Day 3 this week is a 1.5-MILE TIME TRIAL (all-out). Keep THIS day controlled enough that you're fresh for it \u2014 don't bury your legs."},"Back squat 5\xD75 @ 175\u2013185. Add 5# only if bar speed is clearly good.","RDL 4\xD78 @ 195\u2013205 \u2014 back off from the 215 that broke form last week. Clean reps only.","Walking lunge 3\xD712/leg @ 44\u201353#.","Accessory: ham curls + DB curls 3\xD712\u201315.","Grip/carry: farmer carry 4\xD740m @ 65#/hand.","CORE (keep it \u2014 you finally have the streak going): hanging knee raise 3\xD712 + plank 3\xD745s.","METCON (~6 min, controlled \u2014 TT is in 2 days): 6-min AMRAP \u2014 10 KB swing, 8 burpee, 12 air squat."]},2:{name:"Upper strength + grip + metcon \u2014 wk7 (grip FIRST)",items:[{note:"NOTE \u2014 grip stays FIRST while fresh (this fix is working \u2014 you PR'd at 45s doing it early)."},"Grip FIRST: dead hang 3\xD7 max \u2014 chase 45s+ across all three.","Bench 5\xD75 @ 135 \u2014 you hit 140 last week. Try 140 on sets 4-5 if moving well.","Weighted/strict pull-up \u2014 reduce assistance further (you're at 4+ unassisted).","DB row 4\xD710/arm @ 55.","Accessory: triceps + lat raise + rear-delt flye 3\xD712\u201315.","CORE: toes-to-rig 3\xD710 + side plank 2\xD730s/side (permanent swap from ab-wheel).","METCON (~7 min): 7-min AMRAP \u2014 10 cal bike, 10 full push-up, 10 sit-up."]},4:{name:"Spartan metcon \u2014 wk7 (hard, but you tested hard 1 day prior)",items:[{note:"NOTE \u2014 this comes the day after the time trial, so you may be a little flat. Push what you have, but if the TT took a lot out of you, keep it moderate and don't chase a PR time."},"4 RFT: 400m run, 12 DB thrusters @30#, 12 KB swing @44#, 40m heavy carry, 9 burpees.","Rest 60\u201390s between rounds. Effort by feel \u2014 the TT is the priority test this week, this is secondary.","CORE: hollow hold 3\xD730s."]},5:{name:"Full-body strength + sprint metcon \u2014 wk7 (close the block)",items:[{note:"NOTE \u2014 last session before the deload. Push the lifts, then a genuine sprint metcon. Empty the tank; next week is recovery."},"Power clean 5\xD73 \u2014 clean triples at 150\u2013160 (you hit clean 155 recently). Crisp, stop a rep short.","Push press 4\xD76 @ 125\u2013135.","Front squat \u2192 FR lunge 3\xD76 @ 95\u2013105.","METCON (~10 min): 10 \xD7 20s HARD / 40s easy \u2014 full 10 rounds, into 160s-170s.","CORE: single-arm farmer carry 3\xD740m/side.","Cool-down: 5 min easy breathing."]},3:{name:"1.5-MILE TIME TRIAL (replaces Z2 run) \u2014 VO2max test",items:[{note:"NOTE \u2014 this REPLACES the easy run this week. All-out effort. Purpose: get a real VO2max number instead of formula guesses (Apple says ~32, HR-ratio math says ~40; a time trial settles it)."},"CONDITIONS: sea level, flat course or a track. Rested \u2014 don't do this the day after a hard session. Not in extreme heat.","WARMUP: 10 min easy jog + 4 \xD7 20s strides, then 3-5 min easy before you start.","THE TEST: 1.5 miles (6 laps on a standard track) as fast as you can sustain. Even pacing beats going out hot and dying. LOG YOUR TIME.","COOLDOWN: 10 min easy walk/jog.","LOG: total time (mm:ss), avg HR, peak HR. That's all I need to compute VO2max.",{note:"NOTE \u2014 repeat this every 6-8 weeks (next ~Week 13-15) to track real aerobic progress. Same course, same conditions."}]}},8:{1:{name:"DELOAD \u2014 lower, light. Should feel easy.",items:[{note:"READ FIRST \u2014 this is a real deload, not a lighter hard week. Block 2 closed under-recovered and strength was down 15-25%. Take the week properly."},{note:"RULE FOR THE WEEK \u2014 if a set feels hard, you're going too heavy. Deload loads should feel almost insultingly light. That's the point."},{note:"HEAT \u2014 you had heat illness on the 23rd. Tolerance stays impaired for days after. Train indoors or early morning this week. Fluids and salt."},"Back squat 3\xD75 @ 135-145. (Working weight was 185. Don't add.)","RDL 3\xD78 @ 155-165.","Walking lunge 2\xD710/leg, bodyweight or 25-35#.","Farmer carry 3\xD740m @ 44-53#.","CORE: hanging knee raise 2\xD710 + plank 2\xD730s.","NO METCON. Replace with 10 min easy bike or walk, HR under 130.",{note:"Total session should run 35-40 min, not an hour."}]},2:{name:"DELOAD \u2014 upper, light. Grip stays but submax.",items:["Grip: dead hang 2 \xD7 ~30s. NOT max effort. Keep the pattern, drop the intensity \u2014 max hangs are a real nervous-system cost.","Bench 3\xD75 @ 105-115. (You were at 135-140. This will feel light. Good.)","Assisted pull-up 3\xD75 @ 70# assist \u2014 stop 2 reps short of failure every set.","DB row 3\xD710 @ 40-45.","Accessory: triceps + lat raise 2\xD712, light.","CORE: toes-to-rig 2\xD78 + side plank 2\xD730s/side.","NO METCON.",{note:"35 min, out the door."}]},3:{name:"DELOAD \u2014 easy Z2 only. Not a test.",items:["25-30 min easy. HR UNDER 138 the whole way \u2014 below your Z2 floor, not in it.","Walk/jog intervals are fine. Nose-breathing pace. If you can't hold a conversation, slow down.","This is NOT the time trial retest. See the note on Day 5 about when to re-test.","Early morning or indoors. Heat rules still apply."]},4:{name:"DELOAD \u2014 REST. Actually rest.",items:["Full rest day. Optional 20 min easy walk, nothing more.",{note:"CHECKPOINT \u2014 by today you should feel meaningfully fresher. If you still feel flat, extend the deload: repeat Day 3 and Day 4 instead of starting Week 9 on schedule. Nothing in Block 3 works if you start it already dug in."},{note:"If you are still flat after a full easy week, that is worth raising with a medical professional \u2014 not just a training question at that point."},{note:"FUEL \u2014 the GLP-1 makes underfueling easy to miss, and underfueling produces exactly the picture you had last week. Deload weeks are the easiest time to eat enough. Do it."}]},5:{name:"DELOAD \u2014 full body, very light. Close the week.",items:["Power clean 3\xD73 @ 115-125. Technique only. You hit 155 last week \u2014 this is not a strength day, it's a movement day.","Push press 3\xD75 @ 95.","Front squat 2\xD76 @ 65-75.","Single-arm farmer carry 2\xD740m/side @ 44#.","NO SPRINT METCON. 8 min easy spin to finish.",{note:"TIME TRIAL RETEST \u2014 do NOT force it into this week. Conditions to wait for: feeling recovered, early morning, cool weather, and 2-3 hours after eating. If all four line up late this week or early Week 9, take it. Otherwise it waits."},{note:"WEEK 9 starts Block 3. We'll build it once I see how you come out of this week."}]}},9:{1:{name:"LOWER A (quad) + sprint finisher \u2014 wk9 (new block)",items:[{note:"NEW GOAL, NEW BLOCK \u2014 lean and defined with a strong engine. No race. Split is Lower/Upper/Conditioning/Lower/Upper: every muscle group twice a week, cardio every session."},{note:"EVERY MACHINE MOVEMENT HAS A FREE-WEIGHT TWIN. Pick either \u2014 they train the same thing. Free weights are the default where you have the choice."},{note:"LOADS DROP ON PURPOSE. You squatted 185 and benched 140. Those were strength numbers. Hypertrophy lives in the 8-15 rep range at loads you control, stopping 2 reps short of failure."},{note:"Stop 2 reps short on every working set. Failure training costs recovery and buys almost nothing."},"Back squat 4\xD78 @ 155-165. Adjust so the last rep of each set still looks clean.","QUAD VOLUME \u2014 PICK ONE: leg press 3\xD712  |  FREE WEIGHT: heavy goblet squat 3\xD712 @ 60-80#.","Walking lunge 3\xD712/leg @ 40-53#.","QUAD ISOLATION \u2014 PICK ONE: leg extension 3\xD715  |  FREE WEIGHT: reverse Nordic curl 3\xD78-10.","CALVES \u2014 PICK ONE: standing calf raise machine 4\xD715  |  FREE WEIGHT: DB standing calf raise off a plate 4\xD715.","CORE: hanging knee raise 3\xD712 + plank 2\xD760s.","FINISHER (~7 min): 10 \xD7 20m shuttle sprint, walk back between."]},2:{name:"UPPER A (horizontal push/pull) + intervals \u2014 wk9",items:["Bench 4\xD78 @ 115-125.","DB row 4\xD710/arm @ 55.","Incline DB press 3\xD710 @ 45-50.","CHEST ISOLATION \u2014 PICK ONE: cable flye or pec deck 3\xD715  |  FREE WEIGHT: DB flye 3\xD715 @ 20-25#.","REAR DELT \u2014 PICK ONE: cable face pull 3\xD715  |  FREE WEIGHT: bent-over DB rear-delt raise 3\xD715 @ 10-15#.","TRICEPS \u2014 PICK ONE: cable pushdown 3\xD712  |  FREE WEIGHT: overhead DB or EZ-bar extension 3\xD712.","DB curl 3\xD712 @ 25-30#.","Grip: dead hang 3 \xD7 25-30s, 60s rest. Accumulation, not max.","FINISHER (~10 min): row 6 \xD7 250m hard / 90s easy  |  ALT: 6 \xD7 40s shuttle blocks."]},3:{name:"CONDITIONING \u2014 4\xD74 intervals (the cardio priority day)",items:[{note:"This is the session that actually moves your aerobic capacity."},"10 min easy warm-up.","MAIN SET: 4 \xD7 4 min HARD / 3 min easy. Bike, rower, or continuous 20m shuttles.",{note:"On the work intervals push into the 160s. Use the SAME tool each week so the numbers compare."},{note:"LOG IT: watts, distance, or shuttle count per interval."},"8 min cool-down.",{note:"Indoors. Heat rules stand and running outside is out for now."}]},4:{name:"LOWER B (hinge/glute) + intervals \u2014 wk9",items:["RDL 4\xD78 @ 175-185 (barbell). Stretch and control, not load.","Barbell hip thrust 3\xD712 @ 135-185. New.  |  ALT: DB hip thrust or single-leg glute bridge 3\xD712/side.","Bulgarian split squat 3\xD710/leg @ 30-40# DBs. Start lighter than you think.","HAMSTRINGS \u2014 PICK ONE: ham curl machine 3\xD715 @ 80-90  |  FREE WEIGHT: Nordic ham curl 3\xD76, or barbell good morning 3\xD712 @ 65-95.","CALVES \u2014 PICK ONE: seated calf raise machine 3\xD715  |  FREE WEIGHT: seated DB calf raise 3\xD715.","Farmer carry 3\xD740m @ 66#.","CORE: side plank 2\xD745s/side + hollow hold 3\xD730s.","FINISHER (~8 min): 10 \xD7 30s hard / 60s easy, bike or shuttles."]},5:{name:"UPPER B (vertical push/pull) + mixed finisher \u2014 wk9",items:[{note:"POWER CLEANS ARE OUT of the core plan. They build little muscle for the fatigue they cost."},"DB shoulder press 4\xD710 @ 40-45.","VERTICAL PULL \u2014 PICK ONE: assisted pull-up 4\xD76 @ 70# assist  |  FREE WEIGHT: band-assisted pull-up 4\xD76, or eccentric-only pull-up 4\xD74 (5s lower).",{note:"STOP 2 SHORT on every set either way. Four honest sets beats going to failure."},"LAT VOLUME \u2014 PICK ONE: lat pulldown 3\xD712  |  FREE WEIGHT: DB pullover 3\xD712 @ 40-50, or inverted row 3\xD710.","Lateral raise 4\xD715 @ 10-15# (DB). Do not swing them.","Rear-delt flye 3\xD715 @ 10-15# (DB).","Arms: EZ-bar skullcrusher 3\xD712 + hammer curl 3\xD712.","CORE: toes-to-rig 3\xD710 + side plank 2\xD745s/side.","FINISHER (~8 min): 8 \xD7 20m shuttle, then 8 \xD7 30s hard / 60s easy."]}},10:{1:{name:"LOWER A (quad) + sprint finisher \u2014 wk10",items:[{note:"FINISHER GOES FIRST NOW. Week 9 lost the conditioning on three of four lifting days because it sat at the end and the clock ran out. Do it right after your warm-up. At RIR 2 in the 8-15 range it costs you almost nothing on the lifts, and it guarantees the cardio actually happens."},{note:"Week 9 was calibration and you took the bottom of every range, which was correct. Now nudge up. If a load moves for 8 clean reps with 2 left in the tank, add 5-10 lb next week."},"FINISHER FIRST (~7 min): 10 \xD7 20m shuttle sprint, walk back between.","Back squat 4\xD78 @ 160-165. (155 last week, felt heavy \u2014 that is the rep range doing its job, not you regressing.)","QUAD VOLUME \u2014 PICK ONE: leg press 3\xD712  |  FREE WEIGHT: goblet squat 3\xD712 @ 65-75.","Walking lunge 3\xD712/leg @ 45-53#. You ran 6\xD710/leg at 40 last week \u2014 that was nearly double the prescribed volume and is likely why the session felt heavy. Fewer, heavier this time.","QUAD ISOLATION \u2014 PICK ONE: leg extension 3\xD715  |  FREE WEIGHT: reverse Nordic curl 3\xD78-10.","CALVES \u2014 PICK ONE: standing calf raise 4\xD715  |  FREE WEIGHT: DB standing calf raise off a plate 4\xD715, full stretch, pause at the top.","CORE: hanging knee raise 3\xD712 + plank 2\xD760s."]},2:{name:"UPPER A (horizontal push/pull) + intervals \u2014 wk10",items:[{note:"Grip: add the 4th set before you add seconds. That was the plan and it holds."},"FINISHER FIRST (~10 min): row 6 \xD7 250m hard / 90s easy  |  ALT: 6 \xD7 40s shuttle blocks.","Grip: dead hang 4 \xD7 25-30s, 60s rest. Fourth set added.","Bench 4\xD78 @ 120-125. (115 last week for 4\xD78 \u2014 move up.)","DB row 4\xD710/arm @ 55-60.","Incline DB press 3\xD710 @ 45. You used 40 last week, under the prescribed range. Try 45.","CHEST ISOLATION \u2014 PICK ONE: cable flye or pec deck 3\xD715  |  FREE WEIGHT: DB flye 3\xD715 @ 20-25#, soft elbow, light.","REAR DELT \u2014 PICK ONE: cable face pull 3\xD715  |  FREE WEIGHT: bent-over DB rear-delt raise 3\xD715 @ 10-12#.","TRICEPS \u2014 PICK ONE: cable pushdown 3\xD712  |  FREE WEIGHT: overhead DB or EZ-bar extension 3\xD712 @ 20-25#.","DB curl 3\xD712 @ 22-25#. You used 20 last week, under range."]},3:{name:"CONDITIONING \u2014 4\xD74 RETEST",items:[{note:"THIS IS THE REAL BASELINE. The earlier 4\xD74 was run under conditions that capped heart rate, so that number is a floor rather than a baseline."},{note:"If test conditions are clean, run this hard and we get a number to build the block on. If not, run it by feel and retest later \u2014 an inflated comparison helps nobody."},"10 min easy warm-up.","MAIN SET: 4 \xD7 4 min HARD / 3 min easy. Same tool as last week (bike) so the numbers compare.","By interval 3 it should be genuinely uncomfortable.","LOG IT: distance per interval.","8 min cool-down."]},4:{name:"LOWER B (hinge/glute) + intervals \u2014 wk10",items:[{note:"Hip thrust: HOLD 135 and earn 3\xD712 clean before adding weight. You got 10/10/8 last week, which is normal on a new pattern \u2014 that is position and coordination, not strength."},"FINISHER FIRST (~8 min): 10 \xD7 30s hard / 60s easy, bike or shuttles.","RDL 4\xD78 @ 185-195. (185 last week at the top of range \u2014 small step up.)","Barbell hip thrust 3\xD712 @ 135. Same load, chase the reps.","Bulgarian split squat 3\xD710/leg @ 20-25# DBs. (15# last week \u2014 up a notch.)","HAMSTRINGS \u2014 PICK ONE: ham curl 3\xD715  |  FREE WEIGHT: Nordic ham curl 3\xD76, or barbell good morning 3\xD712 @ 65-75.","CALVES \u2014 PICK ONE: seated calf raise 3\xD715  |  FREE WEIGHT: seated DB calf raise 3\xD715.","Farmer carry 3\xD740m @ 66# \u2014 WALK them this week if the floor space is there. Suitcase holds keep the grip work but lose the locomotion, which is where the trap and anti-lateral-flexion load lives.","CORE: side plank 2\xD745s/side + hollow hold 3\xD730s."]},5:{name:"UPPER B (vertical push/pull) + mixed finisher \u2014 wk10",items:[{note:"SHOULDER PRESS IS STRICT this week. You used a push press at 40 last week \u2014 the leg drive moves more weight but takes load off the delts and puts it into legs and triceps, which is backwards for a session built around shoulder width. If 40 is too heavy strict for 4\xD710, drop to 30-35 and earn it back."},"FINISHER FIRST (~8 min): 8 \xD7 20m shuttle, then 8 \xD7 30s hard / 60s easy.","DB shoulder press 4\xD710 @ 30-40, STRICT. No leg drive, no bounce at the bottom.","VERTICAL PULL \u2014 eccentric-only pull-up 4\xD75, 5-8 second lower, wide grip. You did 4\xD74 at 8 seconds last week, which was more than I asked. Add the fifth rep before you add time.","LAT VOLUME \u2014 inverted row 3\xD712, or elevate the feet to make 3\xD710 harder. (You did 3\xD710 last week.)  |  ALT: lat pulldown 3\xD712, DB pullover 3\xD712.","Lateral raise 4\xD715 @ 10-12#. Strict. You tested 15 and settled at 10 last week \u2014 that was the right call.","Rear-delt flye 3\xD715 @ 10-12#.","Arms: EZ-bar skullcrusher 3\xD712 + hammer curl 3\xD712.","CORE: toes-to-rig 3\xD710 + side plank 2\xD745s/side."]}},11:{1:{name:"LOWER A (quad) + conditioning \u2014 wk11",items:[{note:"CONDITIONING TOOL RULES (permanent) \u2014 Day 1: free pick. Day 2: TREADMILL, never bike (4\xD74 is the next day). Day 3: BIKE 4\xD74, locked, nothing after it. Day 4: BIKE, never row or ski erg (hinge pattern in front of RDLs). Day 5: TREADMILL. Ski erg and double unders are fine on Day 1 or Day 5, never in front of a heavy hinge."},"CONDITIONING FIRST (~7 min) \u2014 DEALER'S CHOICE: bike, treadmill, shuttles, ski erg, or double unders. Only day with a free pick.","Back squat 4\xD78 @ 160-165.","QUAD VOLUME \u2014 PICK ONE: leg press 3\xD712  |  FREE WEIGHT: goblet squat 3\xD712 @ 65-75.","Walking lunge 3\xD712/leg @ 45-53#.","QUAD ISOLATION \u2014 PICK ONE: leg extension 3\xD715  |  FREE WEIGHT: reverse Nordic curl 3\xD78-10.","CALVES \u2014 PICK ONE: standing calf raise 4\xD715  |  FREE WEIGHT: DB standing calf raise off a plate 4\xD715.","CORE: hanging knee raise 3\xD712 + plank 2\xD760s."]},2:{name:"UPPER A (horizontal push/pull) + treadmill \u2014 wk11",items:[{note:"NO BIKE TODAY. The 4\xD74 benchmark is tomorrow and it is the only conditioning session being measured. Treadmill keeps the legs and lungs working without loading lats, grip, or spine."},"CONDITIONING FIRST (~9 min): TREADMILL 6 \xD7 60s hard / 90s easy. Set the belt once and leave it. Step on at speed, straddle for the rest. Pace it at something you could hold for 90s \u2014 this is a dose, not a test. LOG belt speed + incline.","Grip: dead hang 4 \xD7 25-30s, 60s rest.","Bench 4\xD78 @ 120-125.","DB row 4\xD710/arm @ 55-60.","Incline DB press 3\xD710 @ 45.","CHEST ISOLATION \u2014 PICK ONE: cable flye or pec deck 3\xD715  |  FREE WEIGHT: DB flye 3\xD715 @ 25#.","REAR DELT \u2014 PICK ONE: cable face pull 3\xD715  |  FREE WEIGHT: bent-over DB rear-delt raise 3\xD715 @ 10-12#, strict.","TRICEPS \u2014 PICK ONE: cable pushdown 3\xD712  |  FREE WEIGHT: overhead DB or EZ-bar extension 3\xD712 @ 25#.","DB curl 3\xD712 @ 25#."]},3:{name:"CONDITIONING \u2014 4\xD74 BIKE (benchmark)",items:[{note:"BENCHMARK HISTORY \u2014 wk9: 5.55 mi (capped HR, a floor not a baseline). wk10: 5.34 mi (tested on a depleted system). wk11: 5.12 mi (legs pre-fatigued by bike sprints the day before). Three attempts, three different confounds, still no clean number."},{note:"CONDITIONS FOR A VALID TEST: bike, no bike work the day before, nothing scheduled after, same time of day, same physiological conditions each attempt. All five or the number does not count."},"10 min easy warm-up.","MAIN SET: 4 \xD7 4 min HARD / 3 min easy. BIKE \u2014 locked tool, do not swap.","LOG IT: distance per interval, plus test conditions.","8 min cool-down."]},4:{name:"LOWER B (hinge/glute) + bike intervals \u2014 wk11",items:[{note:"NO HINGE-PATTERN CONDITIONING TODAY. Rowing and the ski erg are both a hip hinge under a compressed torso. Run to fatigue right before the heaviest hinge of the week, they load the erectors first. Bike keeps the spine neutral."},"CONDITIONING FIRST (~8 min): BIKE 10 \xD7 30s hard / 60s easy.","RDL 4\xD78 @ 185-195.","Barbell hip thrust 3\xD712 @ 135 \u2014 chase 3\xD712 clean before adding load.","Bulgarian split squat 3\xD710/leg @ 20-25# DBs.","HAMSTRINGS \u2014 PICK ONE: ham curl 3\xD715  |  FREE WEIGHT: Nordic ham curl 3\xD76, or barbell good morning 3\xD712 @ 65-75.","CALVES \u2014 PICK ONE: seated calf raise 3\xD715  |  FREE WEIGHT: seated DB calf raise 3\xD715.","Farmer carry 3\xD740m @ 66#, walked.","CORE: side plank 2\xD745s/side + hollow hold 3\xD730s."]},5:{name:"UPPER B (vertical push/pull) + treadmill \u2014 wk11",items:[{note:"Nothing is measured after this session, so this is where the hard conditioning goes."},"CONDITIONING FIRST (~15 min): TREADMILL 5 \xD7 90s hard / 90s easy. Same belt speed every rep. If you fade by rep 3, shorten to 75s rather than slowing the belt. LOG belt speed + incline + reps completed at that speed.","DB shoulder press 4\xD710 @ 30-40, STRICT.","VERTICAL PULL: eccentric-only pull-up 4\xD75, 5-8 second lower.","LAT VOLUME: inverted row 3\xD712  |  ALT: lat pulldown 3\xD712, or DB pullover 3\xD712.","Lateral raise 4\xD715 @ 10-12#, strict.","Rear-delt flye 3\xD715 @ 10-12#.","Arms: EZ-bar skullcrusher 3\xD712 + hammer curl 3\xD712.","CORE: toes-to-rig 3\xD710 + side plank 2\xD745s/side."]}},12:{1:{name:"DELOAD \u2014 lower, light",items:[{note:"WEEK 12 IS THE SCHEDULED BLOCK 3 DELOAD. I had told you Week 12 would carry the clean 4\xD74 and the RDL 190 / hip thrust 155 progressions \u2014 that was wrong, I had lost track of where the deload sat. Those all move to Week 13."},{note:"WHY IT STANDS: four weeks of unbroken accumulation, with a sixth day about to be added. A benchmark run in a deload week is a wasted test anyway."},{note:"RULE FOR THE WEEK \u2014 if a set feels hard, the load is too heavy. Deload sets should feel almost insultingly light."},"CONDITIONING: 10 min easy bike or walk, HR under 140. No intervals this week.","Back squat 3\xD75 @ 135-145.","Goblet squat 2\xD712, light.","Walking lunge 2\xD710/leg, bodyweight to 35#.","Farmer carry 3\xD740m @ 44-53#.","CORE: hanging knee raise 2\xD710 + plank 2\xD730s."]},2:{name:"DELOAD \u2014 upper, light",items:["CONDITIONING: 10 min easy treadmill walk or jog, HR under 140.","Grip: dead hang 2 \xD7 ~30s. NOT max effort.","Bench 3\xD75 @ 105-115.","Assisted or band pull-up 3\xD75, stopping 2 short.","DB row 3\xD710 @ 40-45.","Accessory: triceps + lateral raise 2\xD712, light.","CORE: toes-to-rig 2\xD78 + side plank 2\xD730s/side."]},3:{name:"DELOAD \u2014 easy aerobic. NOT the 4\xD74.",items:[{note:"THE CLEAN 4\xD74 MOVES TO WEEK 13 DAY 3. Do not run it this week \u2014 a deload-week number is a fourth confounded data point and we already have three."},"25-30 min easy. HR under 142 the whole way \u2014 below the Z2 floor, not in it.","Walk/jog intervals are fine. Nose-breathing pace."]},4:{name:"DELOAD \u2014 REST. Actually rest.",items:["Full rest day. Optional 20 min easy walk, nothing more.",{note:"CHECKPOINT \u2014 you should feel meaningfully fresher by today. If you still feel flat after a full easy week, extend the deload rather than starting Block 4 depleted."},{note:"SLEEP \u2014 late sessions are the lever you actually control. Deload week is the cheapest time to move training earlier."}]},5:{name:"DELOAD \u2014 full body, very light",items:["CONDITIONING: 8 min easy spin to finish. No intervals.","DB shoulder press 3\xD78 @ 25-30, strict.","Front squat or goblet squat 2\xD76, light.","Single-arm farmer carry 2\xD740m/side @ 44#.","CORE: side plank 2\xD730s/side.",{note:"WEEK 13 OPENS BLOCK 4 \u2014 clean 4\xD74 on Day 3 under all five test conditions, RDL to 190, hip thrust to 155. Conditioning tool rules carry over unchanged."}]},6:{name:"DELOAD \u2014 Day 6, optional and easy",items:[{note:"DELOAD WEEK. Day 6 becomes properly programmed in Week 13. This week it is optional \u2014 take it only if you want to move, and keep it short."},"25-30 min total, one machine or two, steady @ under 142. No intervals, no core circuit.","If you still feel flat by Friday, skip this entirely and rest."]}},13:{1:{name:"LOWER A (quad) + free-pick conditioning \u2014 wk13",items:[{note:"BLOCK 4 OPENS. One change this week and one only: Day 6 becomes permanent. No heavy top sets yet \u2014 those come in wk15 if recovery holds through wk14. Adding two things at once means you learn nothing from either."},{note:"COMING OFF THE DELOAD \u2014 wk12 worked: session load ran about a third below normal and recovery markers improved. Do not spend that in the first session. Loads below are where wk11 left off, not above it."},"CONDITIONING FIRST (~7 min) \u2014 DEALER'S CHOICE: bike, treadmill, shuttles, ski erg, or double unders. Only day with a free pick.","Back squat 4\xD78 @ 160-165. Start at 160 and only take 165 if set 2 moves clean.","QUAD VOLUME \u2014 PICK ONE: leg press 3\xD712  |  FREE WEIGHT: goblet squat 3\xD712 @ 65-75.","Walking lunge 3\xD712/leg @ 45-53#.","QUAD ISOLATION \u2014 PICK ONE: leg extension 3\xD715  |  FREE WEIGHT: reverse Nordic curl 3\xD78-10.","CALVES \u2014 PICK ONE: standing calf raise 4\xD715  |  FREE WEIGHT: DB standing calf raise off a plate 4\xD715.","CORE: hanging knee raise 3\xD712 + plank 2\xD760s."]},2:{name:"UPPER A (horizontal) + treadmill \u2014 wk13",items:[{note:"NO BIKE TODAY. The 4\xD74 is tomorrow and this is the fifth attempt at a clean number. Treadmill only."},"CONDITIONING FIRST (~9 min): TREADMILL 6 \xD7 60s hard / 90s easy. Baseline is 6.5 mph from wk11 \u2014 hold it, do not raise it. This is a dose, not a test. LOG belt speed + incline.","Grip: dead hang 4 \xD7 25-30s, 60s rest.","Bench 4\xD78 @ 120-125.","DB row 4\xD710/arm @ 55-60.","Incline DB press 3\xD710 @ 45.","CHEST ISOLATION \u2014 PICK ONE: cable flye or pec deck 3\xD715  |  FREE WEIGHT: DB flye 3\xD715 @ 25#.","REAR DELT \u2014 bent-over DB rear-delt raise 3\xD715 @ 10-12#. STRICT: hinge to near-parallel, one-second pause at the top, torso does not move. You ran 25# on Aug 22 and called it easy \u2014 that is the load doing the work through your lats and traps, not the delt.","TRICEPS \u2014 PICK ONE: cable pushdown 3\xD712  |  FREE WEIGHT: overhead DB or EZ-bar extension 3\xD712 @ 25#.","DB curl 3\xD712 @ 25#."]},3:{name:"CONDITIONING \u2014 4\xD74 BIKE. Fifth attempt, first clean one.",items:[{note:"FOUR ATTEMPTS, FOUR CONFOUNDS. wk9: 5.55 mi but heart rate was capped \u2014 a floor, not a baseline. wk10: 5.34 mi on a depleted system. wk11: 5.12 mi with legs pre-fatigued by bike sprints the day before. Every number so far is uninterpretable."},{note:"ALL FIVE CONDITIONS OR IT DOES NOT COUNT: (1) bike, (2) no bike work yesterday, (3) nothing scheduled after this session, (4) same time of day you intend to keep, (5) same physiological conditions as the other attempts \u2014 if anything that caps heart rate is on board, postpone rather than run it."},"10 min easy warm-up.","MAIN SET: 4 \xD7 4 min HARD / 3 min easy. BIKE \u2014 locked tool.","Pace it to hold interval 4 within a few percent of interval 1. A fast first interval you cannot repeat produces the same useless number as the last three attempts.","LOG IT: distance per interval, peak HR, and test conditions.","8 min cool-down."]},4:{name:"LOWER B (hinge/glute) + steady bike \u2014 wk13",items:[{note:"CONDITIONING IS STEADY TODAY, NOT INTERVALS. This is the second aerobic dose of the week and it lands the day after the 4\xD74. NO row or ski erg \u2014 hinge under a compressed torso in front of heavy RDLs is what produced the back tightness."},"CONDITIONING FIRST (~20 min): BIKE steady @ 142-152, cadence 85-95.","RDL 4\xD78 @ 190. Up from 185. If the bar speed slows on set 3, stay at 190 next week rather than forcing 195.","Barbell hip thrust 3\xD712 @ 155. Up from 135 \u2014 you got 3\xD712 clean there on Aug 21.","Bulgarian split squat 3\xD710/leg @ 25# DBs.","HAMSTRINGS \u2014 HAM CURL MACHINE 3\xD715. Good mornings are out: this day already has three hip-dominant lifts and a fourth spine-loaded hinge is cost without benefit. Nordic ham curl 3\xD76 if no machine.","CALVES \u2014 PICK ONE: seated calf raise 3\xD715  |  FREE WEIGHT: seated DB calf raise 3\xD715.","Farmer carry 3\xD740m @ 66#. THREE SETS, with rest. Not one unbroken lap.","CORE: side plank 2\xD745s/side + hollow hold 3\xD730s."]},5:{name:"UPPER B (vertical) + treadmill \u2014 wk13",items:[{note:"Nothing is measured after this session, so this is where the hard conditioning goes."},"CONDITIONING FIRST (~15 min): TREADMILL 5 \xD7 90s hard / 90s easy @ 6.5 mph. Two clean weeks at a speed before raising it \u2014 the deload does not count as one.","DB shoulder press 4\xD710 @ 30-35, STRICT.","VERTICAL PULL: strict pull-up 4\xD75, shoulder-width grip. You hit 3\xD75 strict on Aug 25. Benchmark is 3\xD78-10 strict before any added load \u2014 build reps, not weight.","LAT VOLUME \u2014 PICK ONE: lat pulldown 3\xD712  |  FREE WEIGHT: DB pullover 3\xD712 @ 50, or inverted row 3\xD712.","Lateral raise 4\xD715 @ 10-12#, strict.","Rear-delt flye 3\xD715 @ 10-12#. Same correction as Day 2.","Arms: EZ-bar skullcrusher 3\xD712 @ 40 + hammer curl 3\xD712.","OVERHEAD CARRY 2\xD730m/side @ 35-44#. You improvised this on Aug 28 \u2014 here it is programmed. Ribs down, elbow locked, do not let the ribcage flare. Drop the load if the arm drifts forward.","CORE: toes-to-rig 3\xD710 + side plank 2\xD745s/side."]},6:{name:"DAY 6 \u2014 easy aerobic + core (Z2 base). Now permanent.",items:[{note:"THIS IS THE CHANGE FOR WK13 AND THE ONLY ONE. It is also the session most likely to get upgraded into something hard, which would defeat it. Everything else in the week sits at or above threshold; this is the only one building the aerobic base, and base work is what builds durability."},"HR TARGET: 142-152 the whole session. Slow down rather than push through. Aug 23 ran 141 average but peaked 170 \u2014 hold the ceiling, not just the average.","Warm-up (6 min): treadmill walk 3.5, build to an easy jog.","BLOCK 1 \u2014 TREADMILL 10 min steady @ 142-152 (likely 5.0-5.5 mph).","  Core: hollow hold 3 \xD7 30s (30s rest) + side plank 2 \xD7 45s/side (20s rest).","BLOCK 2 \u2014 BIKE 10 min steady @ 142-152, cadence 85-95.","  Core: hanging knee raise 3 \xD7 12 (45s rest) + dead bug 3 \xD7 10/side (30s rest).","BLOCK 3 \u2014 ROWER 8-10 min steady @ 142-152, stroke rate 20-22 spm. Legs drive, then hinge, then arms.","  Core: plank 2 \xD7 60s (45s rest) + side plank 2 \xD7 30s/side (20s rest).","Cool-down (5 min): easy walk until HR is under 120.",{note:"NO BONUS INTERVALS. If you finish wanting more, that means it worked."}]}},14:{1:{name:"LOWER A (quad) + free-pick conditioning \u2014 wk14",items:[{note:"WK13 RESULT \u2014 first clean 4\xD74 in five attempts: 5.40 mi (1.33 / 1.40 / 1.43 / 1.24). RDL to 195 with good form. Pull-ups 4\xD75 strict. Rear-delt flye finally being done as a rear-delt flye. Good week."},{note:"Lean mass held flat across the last two weeks after falling steadily all summer. Keep doing it."},{info:"Order matters on this day: conditioning, then back squat, then everything else. Nothing that loads the quads goes in front of the main lift."},"CONDITIONING FIRST (~7 min) \u2014 DEALER'S CHOICE: bike, treadmill, shuttles, ski erg, or double unders.","Back squat 4\xD78 @ 160-165. Last week's attempt was run on pre-fatigued quads and broke up. This is the honest retry.","QUAD VOLUME \u2014 PICK ONE: leg press 3\xD712  |  FREE WEIGHT: goblet squat 3\xD712 @ 75.","Walking lunge 3\xD712/leg @ 53#.","QUAD ISOLATION \u2014 PICK ONE: leg extension 3\xD715  |  FREE WEIGHT: reverse Nordic curl 3\xD78-10.","CALVES \u2014 PICK ONE: standing calf raise 4\xD715  |  FREE WEIGHT: DB standing calf raise off a plate 4\xD715.","CORE: hanging knee raise 3\xD712 + plank 2\xD760s."]},2:{name:"UPPER A (horizontal) + treadmill \u2014 wk14",items:[{info:"NO BIKE TODAY \u2014 Day 3 is tomorrow and the tool rule holds whether or not the number is being scored."},"CONDITIONING FIRST (~9 min): TREADMILL 6 \xD7 60s hard / 90s easy @ 6.5 mph. Second clean week at this speed \u2014 hold it here and it goes to 6.8 in wk15. LOG belt speed + incline.","Grip: dead hang 4 \xD7 25-30s, 60s rest.","Bench 4\xD78 @ 120-125.","DB row 4\xD710/arm @ 60.","Incline DB press 3\xD710 @ 40. Down from 45 \u2014 you got 6 reps then dropped to 35 last week, which means 45 was too heavy for 3\xD710. Earn it back.","CHEST ISOLATION \u2014 PICK ONE: cable flye or pec deck 3\xD715  |  FREE WEIGHT: DB flye 3\xD715 @ 25#.","REAR DELT \u2014 bent-over DB rear-delt raise 3\xD710-12 @ 10#, strict. Rep target is lower on purpose: correct form is much harder and 3\xD710 at 10# is the real starting point.","TRICEPS \u2014 PICK ONE: cable pushdown 3\xD712  |  FREE WEIGHT: overhead DB or EZ-bar extension 3\xD712 @ 25#.","DB curl 3\xD712 @ 25#."]},3:{name:"CONDITIONING \u2014 4\xD74 BIKE (pacing practice, not a test)",items:[{note:"NOT A SCORED ATTEMPT. Week 13 gave you a baseline of 5.40 mi and the next scored retest is wk17. Today is for fixing the one flaw in that run."},{note:"THE FLAW: you built 1.33 \u2192 1.40 \u2192 1.43, then dropped 13% to 1.24. Intervals 2 and 3 were above sustainable. Even pacing at 1.38 across all four would have beaten 5.40 for less cost."},{info:"Today's target is not distance. It is interval 4 within 5% of interval 1. Pick a pace in interval 1 you believe you can repeat three more times, then repeat it."},{info:"10 min easy warm-up."},"MAIN SET: 4 \xD7 4 min HARD / 3 min easy. BIKE.","LOG IT: distance per interval.",{info:"8 min cool-down."},{info:"(5) same physiological conditions as the other attempts."}]},4:{name:"LOWER B (hinge/glute) + short bike \u2014 wk14",items:[{note:"CONDITIONING CUT TO 10 MIN. Last week I moved this to 20 minutes of steady bike without removing anything from the lifting, and hamstrings, calves, carries and core all got cut for time. That was my error. Day 6 carries the aerobic dose; this day just needs the engine warm."},"CONDITIONING FIRST (~10 min): BIKE easy @ 142-152.","RDL 4\xD78 @ 200. Up from 195, which moved with good form.","Barbell hip thrust 3\xD712 @ 145. You repeated 135 last week \u2014 that is maintenance, not progression. 145 is the smaller step you asked for.","Bulgarian split squat 3\xD710/leg @ 25-30# DBs.","HAMSTRINGS \u2014 HAM CURL MACHINE 3\xD715, or Nordic ham curl 3\xD76.","CALVES \u2014 PICK ONE: seated calf raise 3\xD715  |  FREE WEIGHT: seated DB calf raise 3\xD715.","Farmer carry 3\xD740m @ 66#, three sets with rest.","CORE: side plank 2\xD745s/side + hollow hold 3\xD730s.",{info:"If you are short on time again, cut the calves. Not the carries, not the hamstrings."}]},5:{name:"UPPER B (vertical) + treadmill \u2014 wk14",items:[{info:"Nothing is measured after this session. This is where the hard conditioning goes."},"CONDITIONING FIRST (~18 min): TREADMILL 6 \xD7 90s hard / 90s easy @ 7.0 mph. That is what you ran last week and it is the new baseline \u2014 repeat it before raising it.","DB shoulder press 4\xD710 @ 30-35, STRICT. Seated is fine and keeps it honest.","VERTICAL PULL: strict pull-up 4\xD75-6, shoulder-width grip. Add the sixth rep where it is clean. Benchmark is 3\xD78-10 strict before any added load.","LAT VOLUME \u2014 PICK ONE: lat pulldown 3\xD712  |  FREE WEIGHT: DB pullover 3\xD712 @ 50, or inverted row 3\xD712.","Lateral raise 4\xD715 @ 10-12#, strict.","Rear-delt flye 3\xD710-12 @ 10#, strict.","Arms: EZ-bar skullcrusher 3\xD712 @ 40 + hammer curl 3\xD712.","OVERHEAD CARRY 2\xD740m/side @ 44#. Holding the load, keeping your distance.",{info:"You ran the overhead carry at 53# for 40m in wk13 \u2014 roughly 45% more total load than prescribed, on a pattern you have done twice. Shoulder under sustained overhead load is the one place to build slowly. Distance first, load later."},"CORE: toes-to-rig 3\xD710 + side plank 2\xD745s/side."]},6:{name:"DAY 6 \u2014 easy aerobic + core (Z2 base)",items:[{info:"HR TARGET: 142-152 the whole session, ceiling included. This is the only session in the week that builds the aerobic base. If you finish it feeling like you trained hard, it did not work."},{info:"Warm-up (6 min): treadmill walk 3.5, build to an easy jog."},"BLOCK 1 \u2014 TREADMILL 10 min steady @ 142-152.","  Core: hollow hold 3 \xD7 30s (30s rest) + side plank 2 \xD7 45s/side (20s rest).","BLOCK 2 \u2014 BIKE 10 min steady @ 142-152, cadence 85-95.","  Core: hanging knee raise 3 \xD7 12 (45s rest) + dead bug 3 \xD7 10/side (30s rest).","BLOCK 3 \u2014 ROWER 8-10 min steady @ 142-152, stroke rate 20-22 spm.","  Core: plank 2 \xD7 60s (45s rest) + side plank 2 \xD7 30s/side (20s rest).",{info:"Cool-down (5 min): easy walk until HR is under 120."},{info:"No bonus intervals. If you finish wanting more, that means it worked."}]}},15:{1:{name:"LOWER A (quad) + free-pick conditioning \u2014 wk15",items:[{note:"I HAVE BEEN PROGRAMMING TOO LIGHT. Across Block 4 you beat the written load on nearly every main lift at moderate RPE: squat took the top of range clean, RDL went 185 \u2192 195 \u2192 205 against 190 and 200 on the card, hip thrust jumped 135 \u2192 155 when I wrote 145. Week 15 is written from where you actually are."},{note:"WK14 RESULT \u2014 4\xD74 at 5.56 mi (1.41 / 1.41 / 1.43 / 1.31) on short sleep and the day after hard treadmill work. Above the clean 5.40 baseline under worse conditions. Intervals 1-3 were flat, which was the assignment; interval 4 still faded 7%."},{info:"Order: conditioning, then back squat, then everything else. Nothing that loads the quads goes in front of the main lift."},"CONDITIONING FIRST (~7 min) \u2014 DEALER'S CHOICE: bike, treadmill, shuttles, ski erg, or double unders.","Back squat 4\xD78 @ 170. You took 165 clean at RPE 6 with a full accessory session behind it.","QUAD VOLUME \u2014 PICK ONE: leg press 3\xD712  |  FREE WEIGHT: goblet squat 3\xD712 @ 75-80.","Walking lunge 3\xD712/leg @ 53#.","QUAD ISOLATION \u2014 PICK ONE: leg extension 3\xD715  |  FREE WEIGHT: REVERSE Nordic curl 3\xD78-10. Note the name: reverse Nordic is the kneeling lean-back that loads quads. The plain Nordic is the falling-forward hamstring version and belongs on Day 4.",{info:"Reverse Nordic form check: hips stayed extended throughout, which is the hard part and you had it. Three fixes \u2014 keep your head neutral instead of looking at the ceiling, hold your hands crossed at the chest for every rep instead of letting them drift forward when you fatigue, and hold this depth while you add reps rather than going deeper."},"CALVES \u2014 PICK ONE: standing calf raise 4\xD715  |  FREE WEIGHT: DB standing calf raise off a plate 4\xD715.","CORE: hanging knee raise 3\xD712 + plank 2\xD760s."]},2:{name:"UPPER A (horizontal) + treadmill \u2014 wk15",items:[{info:"NO BIKE TODAY. Day 3 is tomorrow."},{info:"This day is deliberately the lighter conditioning session because the 4\xD74 is the next morning. The 90s/60s ratio you like lives on Day 5, where nothing downstream is being protected."},"CONDITIONING FIRST (~9 min): TREADMILL 6 \xD7 60s hard / 90s easy @ 7.0 mph. Short intervals, full rest.","Grip: dead hang 4 \xD7 30s, 60s rest.","Bench 4\xD78 @ 125-130. You put up 135 for 8 as a top set on Sep 8.","DB row 4\xD710/arm @ 60-65.","Incline DB press 3\xD710 @ 40-45. You ran 40 clean \u2014 take 45 if set 1 moves well.","CHEST ISOLATION \u2014 PICK ONE: cable flye or pec deck 3\xD715  |  FREE WEIGHT: DB flye 3\xD715 @ 25#.","REAR DELT \u2014 bent-over DB rear-delt raise 3\xD710-12 @ 10#, strict.","TRICEPS \u2014 PICK ONE: cable pushdown 3\xD712  |  FREE WEIGHT: overhead DB or EZ-bar extension 3\xD712 @ 25#.","DB curl 3\xD712 @ 25#."]},3:{name:"CONDITIONING \u2014 4\xD74 BIKE (pacing practice)",items:[{note:"STILL NOT A SCORED ATTEMPT. The scored retest is wk17 under all five conditions. Baseline to beat: 5.40 mi clean, 5.56 mi confounded."},{note:"THE ONE REMAINING FLAW: interval 4. It has faded 6.8% then 7.1% in the last two runs while intervals 1-3 held flat. Holding 1.41 across all four would put you at 5.64."},{info:"Today's only target is interval 4 within 5% of interval 1. If that means starting slower than feels right, start slower."},{info:"10 min easy warm-up."},"MAIN SET: 4 \xD7 4 min HARD / 3 min easy. BIKE.","LOG IT: distance per interval.",{info:"8 min cool-down. Nothing scheduled after this session."}]},4:{name:"LOWER B (hinge/glute) + short bike \u2014 wk15",items:[{info:"Conditioning stays at 10 minutes. Last week this day came in at RPE 6 with everything finished and extra core \u2014 two weeks after the same day was RPE 9 with four items cut. The short conditioning is why."},"CONDITIONING FIRST (~10 min): BIKE easy @ 142-152.","RDL 4\xD78 @ 210-215. You ran 205 at an overall RPE 6.","Barbell hip thrust 3\xD712 @ 165. You called 135 plenty, then did 155 at RPE 6.","Bulgarian split squat 3\xD710-12/leg @ 30# DBs.","HAMSTRINGS \u2014 ham curl machine or prone leg curl 3\xD715 @ 30-35#, or Nordic ham curl 3\xD76.","CALVES \u2014 PICK ONE: seated calf raise 3\xD715  |  FREE WEIGHT: seated DB calf raise 3\xD715.","Farmer carry 3\xD740m @ 70-75#, three sets with rest.","CORE: side plank 2\xD745s/side + hollow hold 3\xD730s.",{info:"Short on time: cut the calves. Not the carries, not the hamstrings."}]},5:{name:"UPPER B (vertical) + treadmill \u2014 wk15",items:[{info:"Nothing is measured after this session. Hard conditioning belongs here."},"CONDITIONING FIRST (~18 min): TREADMILL 6 \xD7 90s hard / 60s easy @ 7.0 mph. Rest drops from 90s to 60s \u2014 that is the progression, not the speed. Take 7.5 on the last two rounds if it is there.","DB shoulder press 4\xD710 @ 35, STRICT. You got 3\xD710 plus a partial fourth at 35 \u2014 finish all four this week before adding load.","VERTICAL PULL: strict pull-up 4\xD76, shoulder-width grip. First 6 came on Sep 11. Benchmark is 3\xD78-10 strict before added load.","LAT VOLUME \u2014 PICK ONE: lat pulldown 3\xD712  |  FREE WEIGHT: DB pullover 3\xD712 @ 50-55, or inverted row 3\xD712.","Lateral raise 4\xD715 @ 10-12#, strict.","Rear-delt flye 3\xD710-12 @ 10#, strict.","Arms: EZ-bar skullcrusher 3\xD710-12 @ 40 + hammer curl 3\xD712.","OVERHEAD CARRY 2\xD740m/side @ 53#. Your load, your call \u2014 you have the history with this one.","CORE: toes-to-rig 3\xD710 + side plank 2\xD745s/side."]},6:{name:"DAY 6 \u2014 easy aerobic + core (Z2 base)",items:[{note:"THIS DAY NEEDS A REST DAY IN FRONT OF IT. Week 14 ran Monday through Sunday with no gap and Day 6 came in at RPE 7 on a full night of sleep \u2014 an easy session that had nothing left in it. That is accumulation, not sleep, and it was a scheduling failure on my end."},{info:"HR TARGET: 142-152, ceiling included. If you finish it feeling like you trained hard, it did not work."},{info:"Warm-up (6 min): treadmill walk 3.5, build to an easy jog."},"BLOCK 1 \u2014 TREADMILL 10 min steady @ 142-152.","  Core: hollow hold 3 \xD7 30s (30s rest) + side plank 2 \xD7 45s/side (20s rest).","BLOCK 2 \u2014 BIKE 10 min steady @ 142-152, cadence 85-95.","  Core: hanging knee raise 3 \xD7 12 (45s rest) + dead bug 3 \xD7 10/side (30s rest).","BLOCK 3 \u2014 ROWER 8-10 min steady @ 142-152, stroke rate 20-22 spm.","  Core: plank 2 \xD7 60s (45s rest) + side plank 2 \xD7 30s/side (20s rest).",{info:"Cool-down (5 min): easy walk until HR is under 120."},{info:"No bonus intervals."}]}},16:{1:{name:"LOWER A (quad) + free-pick conditioning \u2014 wk16",items:[{note:"LEFT KNEE \u2014 medial joint line pain during the descent of the Bulgarian split squat. The Bulgarian is OUT this week. If it is not clearly better in a few days, or if there is swelling, locking or giving way, see a physician or PT."},{note:"WK15 RESULT \u2014 squat 175, bench to 135, RDL 215 clean, hip thrust 165, shoulder press 4\xD710 @ 35, and a 4\xD74 with interval 4 within 1.4% of interval 1. The pacing problem is solved."},{info:"Order: conditioning, then back squat, then everything else. Nothing that loads the quads goes in front of the main lift."},"CONDITIONING FIRST (~7 min) \u2014 DEALER'S CHOICE: bike, treadmill, shuttles, ski erg, or double unders.","Back squat 4\xD78 @ 180. You took 175 at RPE 7 last week. KNEE CHECK: test the first warm-up set honestly \u2014 if the left knee shows up there, stop at parallel or drop the load.","Goblet squat 3\xD712 @ 80. Leg press option removed \u2014 this is the quad volume slot from here on.","Walking lunge 3\xD712/leg @ 53#. Skip if the knee objects; this is the other knee-flexion movement on the day.","REVERSE Nordic curl 3\xD78-10. Kneeling lean-back, quads. Head neutral, hands crossed at the chest the whole set, hold your current depth and add reps.","CALVES \u2014 standing calf raise 4\xD715, machine or DB off a plate.","CORE: hanging knee raise 3\xD712 + plank 2\xD760s."]},2:{name:"UPPER A (horizontal) + treadmill \u2014 wk16",items:[{info:"NO BIKE, NO ROW today. Treadmill is the tool on this day."},"CONDITIONING FIRST (~16 min): TREADMILL 8 \xD7 60s hard @ 7.0 / 60s easy @ 3.0. This is what you have actually been running \u2014 it is now the card.","Grip: dead hang 4 \xD7 30s, 60s rest.","Bench \u2014 ramp to a top set of 8: 115, 125, 130, then 135-140. Ramping worked better than a fixed load last week.","DB row 4\xD710/arm @ 65.","Incline DB press 3\xD710 @ 45.","CHEST ISOLATION \u2014 PICK ONE: cable flye or pec deck 3\xD715  |  FREE WEIGHT: DB flye 3\xD715 @ 25#.","REAR DELT \u2014 bent-over DB rear-delt raise 3\xD710-12 @ 10#, strict.","TRICEPS \u2014 PICK ONE: cable pushdown 3\xD712  |  FREE WEIGHT: overhead DB or EZ-bar extension 3\xD712 @ 25#.","DB curl 3\xD712 @ 25#."]},3:{name:"CONDITIONING \u2014 4\xD74 BIKE (last practice before the wk17 test)",items:[{note:"NEXT WEEK IS THE SCORED RETEST. Numbers so far: 5.40 clean, 5.56 confounded, 5.50 on fresh legs with near-perfect pacing (1.40 / 1.36 / 1.36 / 1.38)."},{note:"WK17 TEST CONDITIONS \u2014 bike, REST THE DAY BEFORE, nothing scheduled after, same time of day. The rest day is now a condition: the best-paced run came on fresh legs and we have no clean evidence either way about a hard Day 2."},{info:"Today is practice, not a test. Hold the even pacing you found last week and try to carry it at a slightly higher opening pace \u2014 1.42 or so on interval 1 rather than 1.40."},{info:"10 min easy warm-up."},"MAIN SET: 4 \xD7 4 min HARD / 3 min easy. BIKE.","LOG IT: distance per interval.",{info:"8 min cool-down. Nothing scheduled after this session."}]},4:{name:"LOWER B (hinge/glute) \u2014 shortened \u2014 wk16",items:[{note:"THIS DAY IS SHORTER NOW. You do not like training hamstrings and glutes and never have, and that is not something programming can fix \u2014 the muscle group still matters. So it gets leaner instead: the leg curl is cut, because between a heavy RDL and a single-leg RDL the hamstring is covered for your goals. Four posterior-chain movements was redundant."},"CONDITIONING FIRST (~10 min): BIKE easy @ 142-152.",{info:"Hinge prep before the RDL: bodyweight hip hinges, then two light ramp sets. Cheap insurance for tight hamstrings."},"RDL 4\xD78 @ 215-220. 215 moved clean with grip as the only limiter \u2014 use straps on the top sets. Grip is trained separately on Day 2.","Barbell hip thrust 3\xD712 @ 175.","SINGLE-LEG RDL 3\xD78/leg @ 30-35# DBs. This replaces the Bulgarian split squat. Almost no knee flexion, hits glute and hamstring directly, doubles as balance work.","CALVES \u2014 seated calf raise 3\xD715, machine or DB.","Farmer carry 3\xD740m @ 75#/hand, three sets with rest.","CORE: side plank 2\xD745s/side + hollow hold 3\xD730s.",{info:"If the knee dislikes the single-leg RDL too, drop to a hip thrust back-off set and tell me."}]},5:{name:"UPPER B (vertical) + treadmill \u2014 wk16",items:[{info:"Nothing is measured after this session. Hard conditioning belongs here."},"CONDITIONING FIRST (~20 min): TREADMILL 8 \xD7 90s hard @ 7.5 / 60s easy @ 3.0. That is what you ran last week; repeat it before raising it.","DB shoulder press 4\xD710 @ 35-40, STRICT. All four sets landed at 35 \u2014 take 40 if set 1 moves clean.","VERTICAL PULL: strict pull-up 4\xD76. HOLD HERE until all four sets are unbroken \u2014 last week broke 4+2 on set four. Benchmark is still 3\xD78-10 before added load.","LAT VOLUME \u2014 DB pullover 3\xD712 @ 55, or lat pulldown 3\xD712.","Lateral raise 4\xD715 @ 10-12#, strict.","Rear-delt flye 3-4\xD710 @ 10#, strict.",{info:"Supersetting the pullover, lateral raise and rear-delt flye works \u2014 different muscle groups, no interference, and it buys back time on a long day."},"Arms: EZ-bar skullcrusher 3\xD712 @ 40 + hammer curl 3\xD712.","OVERHEAD CARRY 2\xD740m/side @ 53#.","CORE: toes-to-rig 3\xD710 + side plank 2\xD745s/side."]},6:{name:"DAY 6 \u2014 easy aerobic + core (Z2 base)",items:[{info:"This day needs a rest day in front of it. If the week has run six straight, skip it rather than grind it \u2014 an easy session with nothing left in it is not an easy session."},{info:"HR TARGET: 142-152, ceiling included. If you finish feeling like you trained hard, it did not work."},{info:"Warm-up (6 min): treadmill walk 3.5, build to an easy jog."},"BLOCK 1 \u2014 TREADMILL 10 min steady @ 142-152.","  Core: hollow hold 3 \xD7 30s (30s rest) + side plank 2 \xD7 45s/side (20s rest).","BLOCK 2 \u2014 BIKE 10 min steady @ 142-152, cadence 85-95.","  Core: hanging knee raise 3 \xD7 12 (45s rest) + dead bug 3 \xD7 10/side (30s rest).","BLOCK 3 \u2014 ROWER 8-10 min steady @ 142-152, stroke rate 20-22 spm.","  Core: plank 2 \xD7 60s (45s rest) + side plank 2 \xD7 30s/side (20s rest).",{info:"Cool-down (5 min): easy walk until HR is under 120."},{info:"No bonus intervals."}]}},17:{1:{name:"LOWER A (quad) — knee-limited — wk17",items:[{note:"LEFT KNEE — NOT YET EXAMINED. Medial joint line pain that started when the knee caved inward on a loaded split squat. Running, air squats and bike intervals have been pain-free since. Until it is examined: no deep loaded knee bends, no single-leg work on that side, no jumping. Whatever the doctor says overrides this card."},{note:"WK16 — Day 4 and Day 6 were missed. No make-up: start the week clean. RDL holds at 215 on Day 4 instead of progressing, because you have not hinged heavy in nine days."},{info:"Rules until the knee is examined: no deep loaded knee flexion, no jumps or landings, nothing that lets the left knee cave inward. If the knee shows up at any point, that movement is over for the day."},"CONDITIONING FIRST (~7 min): bike or treadmill. No double unders, box jumps or shuttles — no landings this week.","Back squat — TEST ONLY, to a box at parallel: empty bar \xD75, 95 \xD75, 135 \xD75. Pain-free at 135 → 3\xD78 @ 135. Any knee pain at any step → stop and go straight to the goblet box squat.","Goblet box squat 3\xD712 @ 50-60 to a 20\" box. Limited depth the knee tolerates.",{info:"Walking lunge: OUT until cleared. Single-leg and knee-caving risk in one movement."},{info:"Reverse Nordic: OUT until cleared. It is deep knee flexion under load, and last time it went deeper than written."},"Calves — standing calf raise 4\xD715.","CORE: hanging knee raise 3\xD712 + plank 2\xD760s."]},2:{name:"UPPER A (horizontal) + treadmill — wk17",items:[{info:"This Day 2 is the run-up to the scored 4\xD74 tomorrow. Run it exactly as written so the test is comparable to the 5.73. NO BIKE, NO ROW."},"CONDITIONING FIRST (~16 min): TREADMILL 8 \xD7 60s hard @ 7.0 / 60s easy @ 3.0.",{info:"Extra rounds, if you have the time, go AFTER the accessories — not in front of them."},"Grip: dead hang 4 \xD7 30s, 60s rest.","Bench — ramp: 115, 125, 135, then 140 \xD78 as the top set. You hit 135 twice last week.","DB row 4\xD710/arm @ 65-70.","Incline DB press 3\xD710 @ 45. Last week was 45 once then 40 — all three at 45 is the target.","DB flye 3\xD715 @ 25#.","Rear-delt raise 3\xD710-12 @ 10#, strict.","Triceps — EZ-bar or overhead DB extension 3\xD712 @ 30#.","DB curl 3\xD712 @ 25#.",{info:"The four isolation moves superset fine. All three sets of each — last week they got cut to two."}]},3:{name:"CONDITIONING — 4\xD74 BIKE — SCORED RETEST",items:[{note:"THIS ONE COUNTS. Number to beat: 5.73 mi (1.42 / 1.44 / 1.45 / 1.42, Sep 23). History: 5.40 clean baseline, 5.56 short sleep, 5.50 fresh legs."},{note:"CONDITIONS — Day 2 run as written the day before (that is the setup the 5.73 came from); same time of day as the 5.73; nothing scheduled after. If any of those can't happen, move the test rather than run it compromised."},{info:"KNEE CHECK: the 10-minute warm-up is the test. If the knee shows up while spinning, stop. The retest waits — a scored number is not worth pushing an unexamined knee through thousands of bends."},{info:"Pacing: open around 1.43 and hold it. Even pacing is what produced the 5.73; do not chase a big first interval. Keep all three recoveries genuinely easy."},{info:"Write down the odometer reading at the START of each interval. If the bike resets, you lose a recovery, not an interval."},{info:"10 min easy warm-up."},"MAIN SET: 4 \xD7 4 min HARD / 3 min easy. BIKE.","LOG IT: distance per interval, plus the start reading of each.",{info:"8 min cool-down. Nothing after this session."}]},4:{name:"LOWER B (hinge/glute) — wk17",items:[{info:"If the knee gets examined before this day, their answer governs what stays in. If it comes after, run it as written — both feet planted for everything."},"CONDITIONING FIRST (~10 min): BIKE easy @ 142-152.",{info:"Hinge prep: bodyweight hip hinges, then two light ramp sets."},"RDL 4\xD78 @ 215, straps on the top sets. Holding, not progressing — it has been over a week since the last heavy hinge.","Barbell hip thrust 3\xD712 @ 170.","45\xB0 back extension 3\xD712, bodyweight or holding a plate. Replaces the single-leg RDL until the knee is cleared — same glute and hamstring job, both feet planted, no chance for the knee to cave.","Seated calf raise 3\xD715.","Farmer carry 3\xD740m @ 75#/hand, three sets with rest.","CORE: side plank 2\xD745s/side + hollow hold 3\xD730s."]},5:{name:"UPPER B (vertical) + treadmill — wk17",items:[{info:"Hard conditioning belongs here — nothing is measured after this session."},"CONDITIONING FIRST (~20 min): TREADMILL 8 \xD7 90s hard @ 7.5 / 60s easy @ 3.0.",{info:"Extra rounds or a faster finish go at the END of the session, after the lifting is done."},"DB shoulder press 4\xD710 @ 35, STRICT. 40 was too heavy last week — own 35 first.","Strict pull-up 4\xD76. HOLD until all four sets are unbroken. Last week opened with 8, then broke 4+2.","DB pullover 3\xD712 @ 55.","Lateral raise 4\xD715 @ 10-12#, strict.","Rear-delt flye 3\xD710-12 @ 10#, strict.",{info:"Pullover, lateral raise and rear-delt flye superset well — full sets this week."},"Arms: EZ-bar skullcrusher 3\xD712 @ 40 + hammer curl 3\xD712.","OVERHEAD CARRY 2\xD740m/side @ 53#.","CORE: toes-to-rig 3\xD710 + side plank 2\xD745s/side."]},6:{name:"DAY 6 — easy aerobic + core (Z2 base)",items:[{info:"Skipped two weeks running. If the week has gone six straight, it is still better to skip than grind — but this is the day that builds the aerobic base, so don't let it become permanently optional."},{info:"HR TARGET: 142-152, ceiling included."},{info:"Warm-up (6 min): treadmill walk 3.5, build to an easy jog."},"BLOCK 1 — TREADMILL 12 min steady @ 142-152.","  Core: hollow hold 3 \xD7 30s + side plank 2 \xD7 45s/side.","BLOCK 2 — BIKE 12 min steady @ 142-152, cadence 85-95.","  Core: hanging knee raise 3 \xD7 12 + dead bug 3 \xD7 10/side.","BLOCK 3 — TREADMILL or BIKE 8 min steady @ 142-152. Rower is out until the knee is cleared — the catch is deep knee flexion.","  Core: plank 2 \xD7 60s + side plank 2 \xD7 30s/side.",{info:"Cool-down (5 min): easy walk until HR is under 120."},{info:"No bonus intervals."}]}},18:{1:{name:"DELOAD — LOWER A (quad) — wk18",items:[{note:"DELOAD WEEK. Volume drops about a third and loads drop about 20%. Every set should finish with reps in the tank — RPE 5-6, never higher. Lifting less this week is the point, not a lapse."},{note:"KNEE — still being evaluated. Same rules until cleared: squats to a box at parallel, light single-leg work only, nothing that lets the knee cave, no jumping."},"CONDITIONING FIRST (~7 min): bike or treadmill, easy. No landings.","Back squat to a box at parallel 3\xD78 @ 95. Deload and knee cap together. Stop if the knee shows up.","Goblet box squat 2\xD712 @ 40-50 to a 20\" box.","Sled push 4\xD720m, moderate load, high handles. Now a permanent part of Day 1. LOG THE LOAD so it can progress.","Standing calf raise 2\xD715.","CORE: hanging knee raise 2\xD712 + plank 2\xD760s."]},2:{name:"DELOAD — UPPER A (horizontal) + treadmill — wk18",items:[{info:"The treadmill stays at full prescription today, not deloaded. Tomorrow is the scored 4\xD74, and the 5.73 came the day after this exact session. Keeping the run-up the same is what makes tomorrow's number comparable."},"CONDITIONING FIRST (~16 min): TREADMILL 8 \xD7 60s hard @ 7.0 / 60s easy @ 3.0. As written, no extra rounds.","Grip: dead hang 3 \xD7 30s.","Bench 3\xD78 @ 115. No ramp to a top set this week.","DB row 3\xD710/arm @ 55.","Incline DB press 2\xD710 @ 35.","DB flye 2\xD715 @ 20#.","Rear-delt raise 2\xD712 @ 10#. Stay hinged to near-parallel and swing the arms out wide, perpendicular to the body. If it feels like a lateral raise, the torso has come up.","Triceps — EZ-bar or overhead DB extension 2\xD712 @ 25#.","DB curl 2\xD712 @ 20#."]},3:{name:"CONDITIONING — 4\xD74 BIKE — SCORED RETEST",items:[{note:"THIS ONE COUNTS. Number to beat: 5.73 mi (1.42 / 1.44 / 1.45 / 1.42, Sep 23). The Sep 30 attempt (5.20) does not count — conditions weren't right."},{note:"CONDITIONS — Day 2 treadmill done as written yesterday; midday, not evening; nothing eaten in the 2-3 hours before (a banana or half a shake is fine); nothing scheduled after. If any of those can't happen, move it rather than run it compromised."},{info:"Deload-week fatigue is lower than when the 5.73 was set. If you beat it, that's part of why — still a real number, just noted."},{info:"KNEE CHECK: the 10-minute warm-up is the test. If the knee shows up while spinning, stop. The retest waits."},{info:"Pacing: open around 1.43 and hold it. Keep all three recoveries genuinely easy."},{info:"Write down the odometer reading at the START of each interval."},{info:"10 min easy warm-up."},"MAIN SET: 4 \xD7 4 min HARD / 3 min easy. BIKE.","LOG IT: distance per interval, plus the start reading of each.",{info:"8 min cool-down. Nothing after this session."}]},4:{name:"DELOAD — LOWER B (hinge/glute) — wk18",items:[{info:"Both feet planted for the heavy work."},"CONDITIONING FIRST (~10 min): BIKE easy @ 142-152.","RDL 3\xD78 @ 175. That's about 80% of the 225 you pulled last week. Straps fine.","Hip thrust 3\xD710 @ 135 barbell, or 2\xD712 @ 70 on the machine.","Single-leg KB RDL 2\xD78/leg @ 35-53#, slow and controlled. Light is the point.","Seated calf raise 2\xD715.","Farmer carry 2\xD740m @ 60#/hand.","CORE: side plank 2\xD745s/side + hollow hold 2\xD730s."]},5:{name:"DELOAD — UPPER B (vertical) + treadmill — wk18",items:["CONDITIONING FIRST (~15 min): TREADMILL 6 \xD7 90s @ 7.0 / 90s easy @ 3.0. Lighter than normal on purpose.","DB shoulder press 3\xD710 @ 30, strict.","Strict pull-up 3\xD75. Crisp, unbroken, nowhere near failure. 4\xD76 comes back in wk19.","DB pullover or EZ-bar pullover 2\xD712 @ 40.","Lateral raise 2\xD715 @ 10#, strict.","Rear-delt flye 2\xD712 @ 10#. Hinged to near-parallel, arms out wide. It should feel different from the lateral raise — back of the shoulder, not the side.",{info:"Lateral raise and rear-delt flye are different muscles: the side delt makes the shoulders wider, the rear delt rounds them out and balances all the pressing. Keep both."},"Arms: EZ-bar skullcrusher 2\xD712 @ 35 + hammer curl 2\xD712.","OVERHEAD CARRY 2\xD730m/side @ 44#.","CORE: toes-to-rig 2
