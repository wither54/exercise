\xD710 + side plank 2\xD745s/side."]},6:{name:"DAY 6 — OPTIONAL easy aerobic",items:[{info:"Optional this week. Do it only if you feel like moving. Skip it without guilt if not."},{info:"HR TARGET: 142-152, ceiling included."},"TREADMILL or BIKE 25-30 min steady @ 142-152.","  Core: plank 2 \xD7 60s + side plank 2 \xD7 30s/side.",{info:"Cool-down (5 min): easy walk until HR is under 120."},{info:"No bonus intervals."}]}},19:{1:{name:"LOWER A (quad) — knee-light — wk19",items:[{note:"KNEE — injury under evaluation. Nothing deep, nothing heavy, nothing twisting. Light and controlled on everything that bends the knee."},{info:"Knee rules this week: no squatting below parallel, no loaded single-leg work, no jumping or landings, no twisting or pivoting on a bent knee. If the knee shows up during any movement, that movement is over for the day — not the session."},"CONDITIONING FIRST (~8 min): bike or treadmill, steady. No landings.","Box squat to parallel 3\xD78 @ 95-115. 115 is the ceiling until the diagnosis. Control the descent; sit to the box, don't drop.","Goblet box squat 2\xD712 @ 50 to a 20\" box.","Sled push 4\xD715m, no heavier than 180#, high handles. Only if the knee is quiet in the warm-up. Steady walk, no sprinting.",{info:"Hip work below is for the knee-caving that started this. Stronger hip abductors keep the knee tracking over the toes."},"Banded lateral walk 3\xD712 steps each way. Band above the knees, slight bend, knees pushed out against the band.","Side-lying hip abduction or cable hip abduction 3\xD715/side, slow.","Standing calf raise 3\xD715.","CORE: hanging knee raise 3\xD712 + plank 2\xD760s."]},2:{name:"UPPER A (horizontal) + treadmill — wk19",items:[{info:"Upper body is back to full. Loads pick up where Week 17 left off, not where the deload was."},"CONDITIONING FIRST (~16 min): TREADMILL 8 \xD7 60s hard @ 7.0-7.5 / 60s easy @ 3.0.",{info:"Extra rounds, if you have the time, go after the accessories."},"Grip: dead hang 4 \xD7 30s.","Bench — ramp: 115, 125, 135, then 145 for as many clean reps as you can, up to 8. Last top set was 145\xD75.","DB row 4\xD710/arm @ 70.","Incline DB press 3\xD710 @ 45.","DB flye 3\xD715 @ 25#.","Rear-delt raise 3\xD712 @ 10-12.5#. Hinged to near-parallel, arms out wide. 12.5 only if it still feels like the back of the shoulder.","Triceps — EZ-bar or overhead DB extension 3\xD712 @ 30#.","DB curl 3\xD712 @ 25#."]},3:{name:"CONDITIONING — 4\xD74 BIKE (training, not scored)",items:[{note:"NOT SCORED. Best clean result: 5.73 mi (Sep 23). Deload-week effort on Oct 9: about 5.63. The next scored test waits until the knee diagnosis is in."},{info:"The bike has been pain-free throughout. Warm-up is still the knee check: if it shows up while spinning, stop."},{info:"Pacing target: 1.43 every interval, recoveries genuinely easy. Write the odometer reading at the start of each interval."},{info:"10 min easy warm-up."},"MAIN SET: 4 \xD7 4 min HARD / 3 min easy. BIKE.","LOG IT: distance per interval, plus the start reading of each.",{info:"8 min cool-down."}]},4:{name:"LOWER B (hinge/glute) — wk19",items:[{info:"Hinges keep the knee nearly straight, so they can load up. Both feet planted on everything."},"CONDITIONING FIRST (~10 min): BIKE easy @ 142-152.",{info:"Hinge prep: bodyweight hip hinges, then two light ramp sets."},"RDL 4\xD78 @ 205-215, straps on the top sets. Back toward the 225 from Week 17, not past it yet.","Hip thrust 3\xD710 @ 155 barbell, or 3\xD712 @ 90 on the machine.","Two-leg DB RDL 2\xD710 @ 50-55, 3 seconds down, 2-second pause at the bottom. Replaces the single-leg version.","Cable or band hip abduction 3\xD715/side.","Seated calf raise 3\xD715.","Farmer carry 3\xD740m @ 75#/hand. Walk straight, no turns at speed.","CORE: side plank 2\xD745s/side + hollow hold 3\xD730s.",{info:"Finish: lying strap hamstring stretch, 2 \xD7 30-45s per leg."}]},5:{name:"UPPER B (vertical) + treadmill — wk19",items:[{info:"Hard conditioning belongs here. Extra rounds go after the lifting."},"CONDITIONING FIRST (~20 min): TREADMILL 8 \xD7 90s hard @ 7.5 / 60s easy @ 3.0.","DB shoulder press 4\xD710 @ 35, strict. Try 40 on set 1; drop back to 35 if it slows.","Strict pull-up 4\xD76. Goal is all four unbroken. Three easy sets of 5 last week says it's there.","DB or EZ-bar pullover 3\xD712 @ 55.","Lateral raise 4\xD715 @ 12.5#, strict.","Rear-delt flye 3\xD712 @ 10-12.5#. Back of the shoulder, not the side.",{info:"Pullover, lateral raise and rear-delt flye superset well."},"Arms: EZ-bar skullcrusher 3\xD712 @ 40 + hammer curl 3\xD712.","OVERHEAD CARRY 2\xD740m/side @ 53#. Walk straight.","CORE: toes-to-rig 3\xD710 + side plank 2\xD745s/side."]},6:{name:"DAY 6 — easy aerobic (Z2)",items:[{info:"HR TARGET: 142-152, ceiling included. Bike or treadmill only — rower stays out until the knee is cleared."},{info:"Warm-up (6 min): easy spin or walk."},"BLOCK 1 — BIKE 15 min steady @ 142-152.","BLOCK 2 — TREADMILL 15 min steady @ 142-152.","  Core: plank 2 \xD7 60s + side plank 2 \xD7 30s/side + dead bug 2 \xD7 10/side.",{info:"Cool-down (5 min): easy walk until HR is under 120."},{info:"No bonus intervals."}]}},20:{1:{name:"LOWER A (quad) — knee-light — wk20",items:[{note:"KNEE — first week back from a break. Work it back slowly. Feeling better is not permission to go deeper or heavier. Squats stay light this week and next."},{info:"Knee rules: no squatting below parallel, no loaded single-leg work, no jumping or landings, no twisting on a bent knee. An ache that holds steady or eases as you warm up is fine. An ache that builds during a set ends that movement for the day."},"CONDITIONING FIRST (~8 min): bike, easy. No landings.","Box squat to parallel 3\xD78 @ 95. Not 115. It stays at 95 this week.","Goblet box squat 2\xD712 @ 40-50 to a 20\" box.","Sled push 4\xD715m @ 140-160#, high handles. Only if the knee is quiet in the warm-up. Steady walk.","Banded lateral walk 3\xD712 steps each way, band above the knees.","Hip abduction 3\xD715/side + hip adduction 3\xD715 light.","Standing calf raise 3\xD715.","CORE: hanging knee raise 3\xD712 + plank 2\xD760s."]},2:{name:"UPPER A (horizontal) + treadmill — wk20",items:[{info:"Upper body is unaffected by the knee. Pick up where Week 19 left off."},"CONDITIONING FIRST (~16 min): TREADMILL 8 \xD7 60s hard @ 7.0-7.5 / 60s easy @ 3.0.",{info:"Extra rounds, if you have the time, go after the accessories."},"Grip: dead hang 4 \xD7 30s.","Bench — ramp: 115, 125, 135, then 145 for as many clean reps as you can, up to 8. Last time: 145\xD74. Beat it.","DB row 4\xD710/arm @ 70.","Incline DB press 3\xD710 @ 45.","DB flye 3\xD715 @ 25#.","Rear-delt raise 3\xD712 @ 10-12.5#. Hinged to near-parallel, arms out wide.","Triceps — EZ-bar or overhead DB extension 3\xD712 @ 30#.","DB curl 3\xD712 @ 25#."]},3:{name:"CONDITIONING — 4\xD74 BIKE (training, not scored)",items:[{note:"NOT SCORED. Best clean result: 5.73 mi (Sep 23). Last week: 5.20 at RPE 7, which doesn't count."},{info:"Effort target: RPE 8 on interval 1, 9 by interval 4. Pacing target 1.40-1.43 per interval. Recoveries genuinely easy."},{info:"Warm-up is the knee check: if it shows up while spinning, stop."},{info:"10 min easy warm-up."},"MAIN SET: 4 \xD7 4 min HARD / 3 min easy. BIKE.","LOG IT: distance per interval, plus the start reading of each.",{info:"8 min cool-down."}]},4:{name:"LOWER B (hinge/glute) — wk20",items:[{info:"First heavy hinge in almost two weeks. Ramp to 205; don't chase 225 yet. Both feet planted on everything."},"CONDITIONING FIRST (~10 min): BIKE easy @ 142-152.",{info:"Hinge prep: bodyweight hip hinges, banded monster walk 2\xD710 each way, then two light ramp sets."},"DB snatch 5\xD73/arm @ 40-50, alternating arms. Feet stay planted, no jump. Catch high, above a quarter squat. Speed and a clean lockout, not load. If the knee shows up on the catch, done for the day.","RDL 4\xD78 @ 185-205, straps on the top sets.","Hip thrust 3\xD710 @ 155 barbell, or 3\xD712 @ 90 on the machine.","Two-leg DB RDL 2\xD710 @ 50-55, 3 seconds down, 2-second pause at the bottom.","Cable or band hip abduction 3\xD715/side.","Banded terminal knee extension 3\xD715/side. Band behind the knee, slight bend to locked out, squeeze the quad 2s.","Seated calf raise 3\xD715.","Farmer carry 3\xD740m @ 75#/hand. Walk straight.","CORE: side plank 2\xD745s/side + hollow hold 3\xD730s.",{info:"Finish: lying strap hamstring stretch, 2 \xD7 30-45s per leg."}]},5:{name:"UPPER B (vertical) + treadmill — wk20",items:[{info:"Same as Week 19's Day 5, which didn't get done. Extra rounds go after the lifting."},"CONDITIONING FIRST (~20 min): TREADMILL 8 \xD7 90s hard @ 7.5 / 60s easy @ 3.0.","DB shoulder press 4\xD710 @ 35, strict. Try 40 on set 1; drop back to 35 if it slows.","Strict pull-up 4\xD76. Goal is all four unbroken.","DB or EZ-bar pullover 3\xD712 @ 55.","Lateral raise 4\xD715 @ 12.5#, strict.","Rear-delt flye 3\xD712 @ 10-12.5#. Back of the shoulder, not the side.",{info:"Pullover, lateral raise and rear-delt flye superset well."},"Arms: EZ-bar skullcrusher 3\xD712 @ 40 + hammer curl 3\xD712.","OVERHEAD CARRY 2\xD740m/side @ 53#. Walk straight.","CORE: toes-to-rig 3\xD710 + side plank 2\xD745s/side."]},6:{name:"DAY 6 — easy aerobic (Z2)",items:[{info:"HR TARGET: 142-152, ceiling included. Bike or treadmill only — rower stays out."},{info:"Warm-up (6 min): easy spin or walk."},"BLOCK 1 — BIKE 15 min steady @ 142-152.","BLOCK 2 — TREADMILL 15 min steady @ 142-152.","  Core: plank 2 \xD7 60s + side plank 2 \xD7 30s/side + dead bug 2 \xD7 10/side.",{info:"Cool-down (5 min): easy walk until HR is under 120."},{info:"No bonus intervals."}]}},21:{1:{name:"LOWER A (quad) — knee-light — wk21",items:[{note:"KNEE — squats stay at 95. The numbers on this card are the limit, not how it feels. 3\xD710 is the cap. If the knee is quiet for 48 hours after, next Day 1 goes to 3\xD712."},{info:"Knee rules: no squatting below parallel, no loaded single-leg work, no jumping or landings, no twisting on a bent knee. An ache that builds during a set ends that movement for the day."},{info:"FUEL: a real meal 2-3 hours before training, protein plus carbs. If that can't happen, a banana and a shake 45-60 minutes before. No training on an empty tank. Woozy mid-session = heavy lifts are over; sit down and eat."},"CONDITIONING FIRST (~8 min): BIKE. Warm-ups stay on the bike while the knee is grouchy on runs.","Box squat to parallel 3\xD710 @ 95. Cap is 3\xD710.","Goblet box squat 2\xD712 @ 50 to a 20\" box.","Sled push 6\xD720m, wheeled sled at 3 of 3 + 45#. Steady walk. Log the setting.","Banded lateral walk 3\xD712 steps each way, band above the knees.","Banded terminal knee extension 3\xD715/side. Slight bend to locked out, squeeze the quad 2s.","Hip abduction 3\xD715/side + hip adduction 3\xD715 light.","Standing calf raise 3\xD715.","CORE: hanging knee raise 3\xD712 + plank 2\xD760-90s."]},2:{name:"UPPER A (horizontal) + treadmill — wk21",items:[{info:"Tomorrow may be the scored 4\xD74. If so, run this treadmill piece exactly as written, no extra rounds."},"CONDITIONING FIRST (~16 min): TREADMILL 8 \xD7 60s hard @ 7.5-8.0 / 60s easy @ 3.0. If the knee gets grouchy, finish the rounds on the bike.","Grip: dead hang 4 \xD7 30s.","Bench — ramp: 115, 125, 135, then 145 for as many clean reps as you can, up to 8. Last time: 145\xD76. Get 8 and the top set moves to 150.","DB row 4\xD710/arm @ 70-75.","Incline DB press 3\xD710 @ 50. Drop to 45 if set 1 grinds.","DB flye 3\xD715 @ 25#.","Rear-delt raise 3\xD712 @ 10-12.5#. Hinged to near-parallel, arms out wide.","Triceps — EZ-bar or overhead DB extension 3\xD712 @ 35#.","DB curl 3\xD712 @ 25#."]},3:{name:"CONDITIONING — 4\xD74 BIKE — SCORED IF CONDITIONS MET",items:[{note:"Number to beat: 5.73 mi (Sep 23). Last week: 5.41 with 4-minute rests at 5:25 AM on 5 hours of sleep, training only."},{note:"SCORED ONLY IF: Day 2 done the day before as written; not before 7 AM; a real meal 2-3 hours before; 6.5+ hours of sleep; nothing right after. Miss any one and it's a training session, still worth doing."},{info:"RECOVERIES ARE 3 MINUTES. Set a timer."},{info:"Pacing: open at 1.43 and hold it. RPE 8 on interval 1, 9 by interval 4. Warm-up is the knee check."},{info:"10 min easy warm-up."},"MAIN SET: 4 \xD7 4 min HARD / 3 min easy. BIKE.","LOG IT: distance per interval, plus the start reading of each. Say whether it met the conditions.",{info:"8 min cool-down."}]},4:{name:"LOWER B (hinge/glute) — wk21",items:[{info:"Eat before this one. Last week's woozy session ran on about 300 calories."},"CONDITIONING FIRST (~10 min): BIKE @ 142-152.",{info:"Hinge prep: bodyweight hip hinges, banded monster walk 2\xD710 each way, then two light ramp sets."},"DB snatch 5\xD73/arm @ 55, alternating. Low reps on purpose: every rep crisp. Feet planted, catch high. Rest 60-90s between sets.","RDL 4\xD78 @ 195-205, straps on the top sets. All four working sets at weight, not a ramp.","Hip thrust 3\xD710 @ 150 total on the machine (including the 50# start), or 155 barbell.","Two-leg DB RDL 2\xD710 @ 55, 3 seconds down, 2-second pause.","Cable or band hip abduction 3\xD715/side.","Banded terminal knee extension 3\xD715/side.","Seated calf raise 3\xD715.","Farmer carry 3\xD740m @ 70#/hand. Walk straight.","CORE: side plank 2\xD745s/side + hollow hold 3\xD730s."]},5:{name:"UPPER B (vertical) + treadmill — wk21",items:["CONDITIONING FIRST (~20 min): TREADMILL 8 \xD7 90s hard @ 8.0 / 60s easy @ 3.0. If the knee gets grouchy, finish the rounds on the bike.","DB shoulder press 4\xD710 @ 40, strict. Last week: all four at 40.","Strict pull-up 4\xD77. Last week: 4\xD76 unbroken.","DB or EZ-bar pullover 3\xD712 @ 50-55.","Lateral raise 4\xD715 @ 10-12.5#, strict.","Rear-delt flye 3\xD712 @ 10-12.5#. Back of the shoulder, not the side.",{info:"Pullover, lateral raise and rear-delt flye superset well."},"Arms: EZ-bar skullcrusher 3\xD712 @ 40-45 + hammer curl 3\xD712.","OVERHEAD CARRY 2\xD740m/side @ 53#. Walk straight.","CORE: toes-to-rig 3\xD710 + side plank 2\xD745s/side."]},6:{name:"DAY 6 — easy aerobic (Z2) — first to drop",items:[{info:"Crunch week? This is the first session to go. Five good sessions beat six on short sleep."},{info:"HR TARGET: 142-152, ceiling included. Bike or treadmill only."},{info:"Warm-up (6 min): easy spin or walk."},"BLOCK 1 — BIKE 15 min steady @ 142-152.","BLOCK 2 — TREADMILL 15 min steady @ 142-152.","  Core: plank 2 \xD7 60s + side plank 2 \xD7 30s/side + dead bug 2 \xD7 10/side.",{info:"Cool-down (5 min): easy walk until HR is under 120."},{info:"No bonus intervals."}]}},22:{1:{name:"LOWER A (quad) — Block 5 — wk22",items:[{note:"NEW BLOCK \xB7 STRENGTH. Eight weeks. Strength first, conditioning second. Main lifts in sets of 5-6 for three weeks, a lighter week, sets of 3-5 for three weeks, then a test week. If time runs short, cut conditioning, not the main lift."},{note:"COMING OFF A COLD? If you're still not right, today is the light version: main lifts at about 80% of the written weight, no hard conditioning, stop if you feel worse. No training with fever or nausea."},{note:"KNEE — squats stay light at 3\xD710. Bike stays out for now; use the SkiErg."},{info:"FUEL: a real meal 2-3 hours before, or a banana and a shake 45-60 minutes before. Woozy mid-session = heavy lifts are over."},{info:"WARM-UP (~10 min): SkiErg 5 min easy, then banded lateral walk 2\xD712 each way, banded terminal knee extension 2\xD715/side, hip abduction 2\xD715/side. The band work is the knee work. It happens first so it doesn't get cut."},"Box squat to parallel 3\xD710 @ 95. Cap holds for now.","Goblet box squat 2\xD712 @ 50.","Sled push 6\xD720m. Log the sled, the floor and the load.","Standing calf raise 3\xD715.","CORE: hanging knee raise 3\xD712 + plank 2\xD760-90s."]},2:{name:"UPPER PUSH (heavy) + SkiErg — wk22",items:[{info:"Main lift first. Rest 2-3 minutes between bench sets; this is strength work, not a circuit."},"Warm-up: SkiErg 4 min easy + band pull-aparts 2\xD715.","BENCH 5\xD75 @ 150. Ramp 95, 115, 135 first. Last week's 145\xD78 says 150 is there. If set 5 fails, note the reps.","Push press 4\xD76 @ 95-105. Short knee dip only, then drive. Feet stay planted.","Dips 3\xD78, bodyweight. Stop a rep short of failure. Bench dips if the shoulders complain.","DB row 3\xD710/arm @ 70. Keeps the pressing balanced.","Triceps — overhead DB extension 3\xD712 @ 35.","SKIERG FINISHER: 6 \xD7 30s hard / 30s easy."]},3:{name:"CONDITIONING — SkiErg 2k BASELINE",items:[{note:"BASELINE TEST. 2,000 meters on the SkiErg for time. This is the number Week 29 has to beat. Same conditions rules as a scored 4\xD74: Day 2 the day before, fed, 6.5+ hours of sleep, not before 7 AM, not sick."},{info:"Damper 5-7. Pacing: settle into a split you can hold for the first 1,000, then go. Most people start too fast."},{info:"10 min easy warm-up on the SkiErg or an incline treadmill walk, with 2 short pickups."},"SKIERG 2,000m for time.","LOG IT: total time, average 500m split, damper setting. Say whether it met the conditions.",{info:"10 min easy cool-down. Walk, not bike."}]},4:{name:"LOWER B (hinge) — wk22",items:[{info:"WARM-UP (~10 min): SkiErg 5 min easy, then banded lateral walk 2\xD712 each way, banded terminal knee extension 2\xD715/side, hip abduction 2\xD715/side. The band work is the knee work. It happens first so it doesn't get cut."},"DB snatch 5\xD73/arm @ 55, alternating. Feet planted, catch high. If last week's 55 was smooth, take 60 on the last two sets.","RDL 5\xD75 @ 215, straps fine. All five sets at weight.","Hip thrust 3\xD78 @ 160 total on the machine, or 165 barbell.","Seated calf raise 3\xD715.","Farmer carry 3\xD740m @ 70#/hand.","CORE: side plank 2\xD750s/side + hollow hold 3\xD740s."]},5:{name:"UPPER PULL (heavy) + intervals — wk22",items:[{info:"Main lifts first, 2-3 minutes rest. Intervals last; cut them before cutting a main lift."},"Warm-up: SkiErg 4 min easy + dead hang 2\xD730s.","WEIGHTED PULL-UP 5\xD75 @ +10 lb. Belt or a DB between the feet. If set 1 is a grind, drop to bodyweight 5\xD75.","DB STRICT PRESS 4\xD76 @ 50. Last week: 2\xD710 at 45. If 50 won't go 6 clean, 45.","Bench, volume 3\xD78 @ 125. Second bench exposure of the week. Smooth, not hard.","Lateral raise 3\xD715 @ 10-12.5 + rear-delt flye 3\xD712 @ 10-12.5, superset.","Hammer curl 3\xD710 @ 30.","INTERVALS: 8 \xD7 60s hard / 60s easy. Treadmill @ 8.0 if a 3-minute walk shows a quiet knee; otherwise SkiErg."]},6:{name:"DAY 6 — easy aerobic — first to drop",items:[{info:"Crunch week, or still shaking off the cold? This goes first."},"SkiErg 15 min steady + incline treadmill walk 15 min (10-12% grade, 3.0-3.5 mph). Conversational pace the whole time.","  Core: plank 2 \xD7 60s + side plank 2 \xD7 30s/side + dead bug 2 \xD7 10/side.",{info:"No bonus intervals."}]}},23:{1:{name:"LOWER A (quad) — Block 5 — wk23",items:[{note:"THE WRITTEN WEIGHT IS THE WEIGHT. If you change one, write down why before the set, not after. Missing plates is a reason only if the number truly can't be built."},{note:"KNEE — box squat 3\xD710 @ 115 to parallel is the ceiling. No extra sets, no extra weight. Sore the next morning = back to 95 next time. Bike stays out; use the SkiErg."},{info:"FUEL: a real meal 2-3 hours before, or a banana and a shake 45-60 minutes before. Woozy mid-session = heavy lifts are over."},{info:"WARM-UP (~10 min): SkiErg 5 min easy, then banded lateral walk 2\xD712 each way, hip abduction 2\xD715/side, terminal knee extension 2\xD715/side (short band looped around a rack upright at knee height, other end behind the knee; or lying on a bench, towel under the knee, press down and lift the heel, 3\xD712 with a 2-second hold)."},"Box squat to parallel 3\xD710 @ 115. Ceiling, not a starting point.","Goblet box squat 2\xD712 @ 50.","Sled push 6\xD720m. Six, not seven. Log the sled, the floor and the load.","Standing calf raise 3\xD715.","CORE: hanging knee raise 3\xD712 + plank 2\xD760-90s."]},2:{name:"UPPER PUSH (heavy) + SkiErg — wk23",items:[{info:"Main lift first. Rest 2-3 minutes between bench sets."},"Warm-up: SkiErg 4 min easy + band pull-aparts 2\xD715.","BENCH 5\xD75 @ 150. Ramp 95, 115, 135. Find 2.5s before you start. No 2.5s = 145, not 155. Last week: 155\xD75, 5, 3. All 25 reps at 150 = 155 next week.","Push press 4\xD76 @ 105. Short dip, drive, feet planted.","Dips 3\xD76, bodyweight. Stop a rep short. Last week 3\xD75.","DB row 3\xD710/arm @ 70.","Triceps — overhead DB extension 3\xD712 @ 35.","SKIERG FINISHER: 6 \xD7 30s hard / 30s easy. Last week 1,181m. Beat it. Drive from the hips; the arms finish the pull."]},3:{name:"CONDITIONING — SkiErg + incline intervals",items:[{info:"Not a test. Hard but controlled. 2k baseline stands at 9:50.4 (sleep borderline)."},"Warm-up: 8 min easy, SkiErg or treadmill walk, with 2 short pickups.","4 \xD7 4 min hard / 3 min easy. Rounds 1 and 3: SkiErg, damper 6, aim to hold 2:25/500m or faster. Rounds 2 and 4: treadmill walk at 12-15% incline, 3.5-4.0 mph, no handrails.","LOG IT: SkiErg meters and split for rounds 1 and 3; incline and speed for 2 and 4; peak heart rate.","Lat pullover 3\xD712 @ 30 (EZ bar or DB) + hollow hold 3\xD730-40s. This is the SkiErg arm work.",{info:"10 min easy cool-down. Walk, not bike."}]},4:{name:"LOWER B (hinge) — wk23",items:[{info:"WARM-UP (~10 min): SkiErg 5 min easy, then banded lateral walk 2\xD712 each way, hip abduction 2\xD715/side, terminal knee extension 2\xD715/side (short band looped around a rack upright at knee height, other end behind the knee; or lying on a bench, towel under the knee, press down and lift the heel, 3\xD712 with a 2-second hold)."},"DB snatch 5\xD73/arm, alternating. Sets 1-3 @ 60, sets 4-5 @ 65 if 60 was smooth. Feet planted, catch high.","RDL 5\xD75 @ 215, straps fine. Missed last week, so this is the priority. No rack needed: pull the first rep from the floor.","Hip thrust 3\xD78 @ 160 total on the machine, or 165 barbell.","Seated calf raise 3\xD715.","Farmer carry 3\xD740m @ 70#/hand.","CORE: side plank 2\xD750s/side + hollow hold 3\xD740s.",{info:"Short on time? Cut core, then carries, then calves. Never the RDL."}]},5:{name:"UPPER PULL (heavy) + intervals — wk23",items:[{info:"Main lifts first, 2-3 minutes rest. Intervals last; cut them before a main lift. No rollouts the day before this session."},"Warm-up: SkiErg 4 min easy + dead hang 2\xD730s.","PULL-UP 5\xD75, bodyweight. Stop one rep short of failure on every set. Last week's failure sets went 6, 4, 4, 4. All 25 clean = +5 lb next week.","DB STRICT PRESS 4\xD76 @ 50. Last week 6, 6, 4, then 6 @ 45.","Bench, volume 3\xD78 @ 125. Bar + 25, 10, 5 per side. Smooth, not hard.","Lateral raise 3\xD715 @ 10-12.5 + rear-delt flye 3\xD712 @ 10-12.5, superset.","Hammer curl 3\xD710 @ 30.","INTERVALS: 8 \xD7 60s hard / 60s easy. Treadmill @ 8.5 if the knee was quiet the morning after last week's run and a 3-minute walk is quiet; 8.0 if any doubt; SkiErg if the knee is grouchy."]},6:{name:"DAY 6 — easy aerobic — first to drop",items:[{info:"Crunch week? This goes first."},"SkiErg 15 min steady + incline treadmill walk 15 min (10-12% grade, 3.0-3.5 mph). Conversational pace the whole time.","  Core: plank 2 \xD7 60s + side plank 2 \xD7 30s/side + dead bug 2 \xD7 10/side.",{info:"No bonus intervals."}]}}},r4=[{label:"Block 1 \xB7 Reintroduction",weeks:[1,2,3,4],note:"Wks 1\u20134 build (wk4 autoregulated, not a deload \u2014 you hadn't accumulated enough fatigue to warrant one). Z2 run day: easy means easy.",split:t4},{label:"Block 2 \xB7 Build",weeks:[5,6,7,8],note:"Progress LOAD, hold volume \u2014 heavier where earned, no added sets. Wk8 = deload.",split:t4},{label:"Block 3 \xB7 Recomp foundation",weeks:[9,10,11,12],note:"GOAL CHANGED (Aug 2) \u2014 no race. Target is lean and defined with a strong engine. New split: Lower/Upper/Conditioning/Lower/Upper, every muscle group 2x per week, cardio every day. Loads DROP into hypertrophy ranges; this is not a strength block. Wk12 = deload.",split:XA},{
