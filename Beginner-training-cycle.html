<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training Cycle">
<meta name="theme-color" content="#151814">
<title>Training Cycle</title>
<style>
:root{
 --bg:#f5f4ef;--panel:#ffffff;--panel2:#efeee8;--ink:#1c1e1a;--dim:#5f605a;--line:#dcdbd4;
 --accent:#4a7300;--accent-ink:#ffffff;--accent-soft:#e8f2d4;--warn:#9a5b00;--warn-soft:#fbefd9;
 --fig:#2b2d28;--fig-far:#a3a59e;--metal:#7c7b75;--muscle:#e0532f;--good:#2f7d32;
 --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#121411;--panel:#1b1e1a;--panel2:#242822;--ink:#ecebe6;--dim:#a3a39b;--line:#333931;
 --accent:#c8f04a;--accent-ink:#141612;--accent-soft:#2a3418;--warn:#f0b35a;--warn-soft:#3a2e1a;
 --fig:#ecebe6;--fig-far:#7f8179;--metal:#b9b7b0;--muscle:#ff7a59;--good:#7fd17f;}}
:root[data-theme="dark"]{
 --bg:#121411;--panel:#1b1e1a;--panel2:#242822;--ink:#ecebe6;--dim:#a3a39b;--line:#333931;
 --accent:#c8f04a;--accent-ink:#141612;--accent-soft:#2a3418;--warn:#f0b35a;--warn-soft:#3a2e1a;
 --fig:#ecebe6;--fig-far:#7f8179;--metal:#b9b7b0;--muscle:#ff7a59;--good:#7fd17f;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:680px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-size:20px;margin:0;letter-spacing:-.2px}.brand h1 span{color:var(--accent)}
.brand small{color:var(--dim);font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;gap:4px;max-width:680px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--panel2)}
nav.tabs svg{width:22px;height:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0}
.muted{color:var(--dim)}.small{font-size:13px}
.weeknav{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:16px;font-weight:700}
.iconbtn:disabled{opacity:.35}
.wk{flex:1;text-align:center}.wk b{display:block;font-size:22px;letter-spacing:-.3px}.wk span{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
select.wsel{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:15px}
.note.warn{background:var(--warn-soft)}
.days{display:grid;gap:6px;margin:12px 0}
.days button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 4px 8px;text-align:center;min-height:56px}
.days button b{display:block;font-size:15px}.days button small{display:block;font-size:11px;color:var(--dim);line-height:1.2;margin-top:2px}
.days button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.days .done b::after{content:" \2713";color:var(--good)}
.dayhead h2{font-size:21px;margin:16px 0 2px;letter-spacing:-.2px}.dayhead p{margin:0;color:var(--dim);font-size:14px}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:12px 0;overflow:hidden}
.ex .hd{padding:14px 14px 0}
.ex h3{font-size:17px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.rx{font-size:15px;margin:4px 0 0;font-weight:600}
.cue{font-size:14px;color:var(--dim);margin:6px 0 0}
.weight{margin:12px 14px 0;padding:12px;border-radius:12px;background:var(--panel2)}
.weight .big{font-size:26px;font-weight:800;letter-spacing:-.4px}.weight .big small{font-size:14px;font-weight:600;color:var(--dim);margin-left:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.num{width:110px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:17px}
input.log{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:15px}
.wbox{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13px;font-weight:700;color:var(--ink)}
.wbox span small{display:block;font-weight:500;color:var(--dim);font-size:12px}
.wbox input{width:110px;padding:10px 12px;border-radius:10px;border:2px solid var(--accent);background:var(--accent-soft);font-size:19px;font-weight:700;color:var(--ink)}
.setlbl{font-size:12px;font-weight:700;color:var(--dim);margin:0 0 4px;text-transform:uppercase;letter-spacing:.6px}
.sets{display:grid;gap:6px}.setbox{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--dim);text-align:center;font-weight:600}
.setbox input{width:100%;min-width:0;padding:10px 4px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:17px;font-weight:600;color:var(--ink)}
.wbox input::placeholder,.setbox input::placeholder{color:var(--dim);opacity:.55;font-weight:500}
.seg button.sg{border:2px dashed var(--accent)}
.sugg{margin-top:6px;color:var(--ink)}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink)}
.tool[aria-expanded="true"]{border-color:var(--accent)}
.toolpanel{margin:8px 14px 0;padding:12px;border-radius:12px;background:var(--panel2);font-size:14px}.toolpanel.warn{background:var(--warn-soft)}.toolpanel ul{margin:6px 0 0;padding-left:18px}
.timerbar{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:15;max-width:656px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timerbar.show{display:flex}.timerbar b{font-size:26px;flex:1;font-variant-numeric:tabular-nums}.timerbar .tlabel{font-size:12px;text-transform:uppercase;letter-spacing:.8px;opacity:.75}
.timerbar .btn{background:transparent;color:var(--bg);border-color:rgba(127,127,127,.6);padding:8px 10px}
.timerbar.done{background:var(--accent);color:var(--accent-ink)}.timerbar.done .btn{color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.logrow{display:flex;gap:8px;align-items:flex-end}.logrow label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim);font-weight:600}
.logrow label.grow{flex:1;min-width:0}.logrow label small{font-weight:500;font-size:11px}.logrow input.num{width:100px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.foot{padding:12px 14px 14px}
.howto{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:10px 0 0;display:inline-flex;gap:6px;align-items:center}
.checkin{margin-top:12px}.checkin p{margin:0 0 6px;font-size:14px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 4px;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.diag{background:var(--panel2);border-top:1px solid var(--line);padding:12px 14px 14px}
.frames{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;align-items:end}
.frames svg{width:100%;height:auto;display:block}
@media (max-width:520px){.frames{grid-template-columns:1fr 1fr}.frames>div:first-child{grid-column:1/-1;max-width:300px;width:100%;margin:0 auto}}
.cap{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);text-align:center;margin-top:2px}
.legend{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0 4px}
.sw{width:14px;height:14px;border-radius:4px;background:var(--muscle);flex:none}
.diag ol,.diag ul{margin:6px 0 0;padding-left:20px;font-size:14px}.diag li{margin:2px 0}
.diag h4{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin:12px 0 0}
.vid{display:inline-block;margin-top:12px;color:var(--accent);font-weight:700;text-decoration:none;font-size:15px}
.term{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.termbox{font-size:14px;background:var(--panel2);border-radius:10px;padding:10px 12px;margin-top:8px}
.picks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.picks button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:7px 12px;font-size:14px;font-weight:600}
.picks button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.donebar{margin:18px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.prog{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:10px 0}
.prog i{display:block;height:28px;border-radius:5px;background:var(--panel2);position:relative}
.prog i b{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:5px}
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto}
.overlay .in{max-width:560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 16px 40px}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;margin:10px 0}
.choice b{font-size:17px}.choice span{display:block;color:var(--dim);font-size:14px;margin-top:2px}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
details.lib{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
details.lib summary{padding:12px 14px;font-weight:600;cursor:pointer;list-style:none}
details.lib summary::-webkit-details-marker{display:none}
details.lib summary small{display:block;font-weight:400;color:var(--dim);font-size:13px}
.gl dt{font-weight:700;margin-top:12px}.gl dd{margin:2px 0 0;color:var(--ink);font-size:15px}
.saved{color:var(--good);font-weight:600;font-size:14px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
 <header class="top"><div class="brand"><h1>Training <span>Cycle</span></h1><small id="hdrsub"></small></div></header>
 <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="overlay"></div>
<script>
/* Training Cycle — movement diagram engine.
   Side-view mannequin (facing right) built from hip/shoulder/hand/ankle targets with 2-bone IK,
   plus a front-view mannequin for frontal-plane moves. Working muscles drawn in --muscle color. */
(function(){
const L={torso:30,neck:3.5,head:6.8,ua:16.5,fa:15.5,th:24,sh:23,foot:9};
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const len=a=>Math.hypot(a[0],a[1]), nrm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l]};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1], cross=(a,b)=>a[0]*b[1]-a[1]*b[0];
function ik(r,t,l1,l2,bend){let dx=t[0]-r[0],dy=t[1]-r[1],d=Math.hypot(dx,dy);d=Math.min(d,l1+l2-0.01);d=Math.max(d,Math.abs(l1-l2)+0.01);
 const a=Math.atan2(dy,dx),c=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));const s=a+bend*c;return [r[0]+l1*Math.cos(s),r[1]+l1*Math.sin(s)];}
function lerp(a,b,k){if(Array.isArray(a)&&Array.isArray(b))return a.map((v,i)=>lerp(v,b[i],k));if(typeof a==='number'&&typeof b==='number')return a+(b-a)*k;
 if(a&&b&&typeof a==='object'&&typeof b==='object'){const o={};for(const key in a)o[key]=(key in b)?lerp(a[key],b[key],k):a[key];return o}return k<0.5?a:b}
function C(){const s=getComputedStyle(document.documentElement),g=n=>s.getPropertyValue(n).trim();
 return {ink:g('--fig')||'#ecebe6',far:g('--fig-far')||'#7d7f78',metal:g('--metal')||'#b9b7b0',line:g('--line')||'#343a32',ac:g('--accent')||'#c8f04a',mu:g('--muscle')||'#ff7a59'}}
const seg=(a,b,w,c,op)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${op?` opacity="${op}"`:''}/>`;
const dotc=(p,r,c,op)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${c}"${op?` opacity="${op}"`:''}/>`;
// resolve {rel:'sh'|'hip'|'hd', dx, dy}
function res(v,g){if(v&&!Array.isArray(v)&&typeof v==='object'){const b=g[v.rel];return [b[0]+(v.dx||0),b[1]+(v.dy||0)]}return v}
// offset stripe along a segment on one side
function stripe(a,b,n,s0,s1,off,w,c,op){const p0=add(add(a,mul(sub(b,a),s0)),mul(n,off)),p1=add(add(a,mul(sub(b,a),s1)),mul(n,off));return seg(p0,p1,w,c,op)}
// normal of segment a->b pointing toward point c (concave side); fallback vector when nearly straight
function sideN(a,b,c,fb){const u=nrm(sub(b,a));let n=[-u[1],u[0]];const cr=cross(u,sub(c,a));if(Math.abs(cr)<1.2){if(dot(n,fb)<0)n=mul(n,-1);return n}return cr>0?n:mul(n,-1)}

/* ---------- SIDE VIEW ---------- */
function sideGeom(p){
 const f=p.face||1; let t;
 if(p.sh){const v=sub(p.sh,p.hip);t=deg(Math.atan2(f*v[0],-v[1]));} else t=p.torso||0;
 const tr=rad(t), u=[f*Math.sin(tr),-Math.cos(tr)], sh=p.sh?p.sh:add(p.hip,mul(u,L.torso));
 const ht=rad(t+(p.headTilt||0)), hd=add(sh,mul([f*Math.sin(ht),-Math.cos(ht)],L.neck+L.head));
 const F=[f*Math.cos(tr),Math.sin(tr)];
 const g={sh,hd,hip:p.hip,f,t:tr,u,F};
 const hN=res(p.handN,g), hF=res(p.handF||p.handN,g), aN=res(p.ankN,g), aF=res(p.ankF||p.ankN,g);
 const kb=(p.kneeBend??1)*f*-1, kbF=(p.kneeBendF??p.kneeBend??1)*f*-1, eb=(p.elbowBend??-1)*f*-1, ebF=(p.elbowBendF??p.elbowBend??-1)*f*-1;
 Object.assign(g,{hN,hF,aN,aF,kN:ik(p.hip,aN,L.th,L.sh,kb),kF:ik(p.hip,aF,L.th,L.sh,kbF),eN:ik(sh,hN,L.ua,L.fa,eb),eF:ik(sh,hF,L.ua,L.fa,ebF)});
 g.aN=aN;g.aF=aF;
 const toe=(a,v)=>v?res(v,g):add(a,[f*L.foot,(p.toeDrop||0)]);
 g.tN=toe(aN,p.toeN);
 g.tF=p.toeF?res(p.toeF,g):(p.toeN&&p.toeN.rel==='aN'?add(aF,[p.toeN.dx||0,p.toeN.dy||0]):toe(aF,null));
 return g;
}
function muscleSide(g,ms,c,far){
 const op=far?0.55:null, o=[];const W={th:far?8:8.5,sh:far?6.5:7,ua:far?5.5:6,fa:far?4.8:5.2,tor:13};
 const hip=g.hip,k=far?g.kF:g.kN,a=far?g.aF:g.aN,e=far?g.eF:g.eN,h=far?g.hF:g.hN,sh=g.sh;
 const backLeg=mul(g.F,-1);
 const nTh=sideN(hip,k,a,backLeg), nSh=sideN(k,a,hip,backLeg);
 const nUa=sideN(sh,e,h,g.F);
 const has=m=>ms.includes(m);
 if(has('quads'))o.push(stripe(hip,k,mul(nTh,-1),0.15,0.85,W.th*0.28,W.th*0.42,c,op));
 if(has('hamstrings'))o.push(stripe(hip,k,nTh,0.2,0.85,W.th*0.28,W.th*0.42,c,op));
 if(has('calves'))o.push(stripe(k,a,nSh,0.12,0.55,W.sh*0.28,W.sh*0.45,c,op));
 if(has('biceps'))o.push(stripe(sh,e,nUa,0.2,0.85,W.ua*0.28,W.ua*0.45,c,op));
 if(has('triceps'))o.push(stripe(sh,e,mul(nUa,-1),0.2,0.85,W.ua*0.28,W.ua*0.45,c,op));
 if(has('forearms'))o.push(stripe(e,h,[0,0],0.15,0.8,0,W.fa*0.55,c,op));
 if(!far){
  if(has('glutes'))o.push(dotc(add(add(hip,mul(g.F,-3.2)),mul(g.u,-1)),4.6,c));
  if(has('chest'))o.push(stripe(hip,sh,g.F,0.58,0.88,W.tor*0.3,W.tor*0.36,c));
  if(has('abs'))o.push(stripe(hip,sh,g.F,0.12,0.52,W.tor*0.24,W.tor*0.45,c));
  if(has('back'))o.push(stripe(hip,sh,mul(g.F,-1),0.45,0.9,W.tor*0.24,W.tor*0.45,c));
  if(has('lowback'))o.push(stripe(hip,sh,mul(g.F,-1),0.08,0.42,W.tor*0.24,W.tor*0.45,c));
  if(has('shoulders'))o.push(dotc(sh,4.4,c));
 }
 return o.join('');
}
function drawSide(p,eq,ms,k){
 const g=sideGeom(p);let s='';
 const ctx={p,g,k};
 s+=(eq.back||[]).map(e=>EQ[e[0]](ctx,...e.slice(1))).join('');
 s+=seg(g.sh,g.eF,5.5,k.far)+seg(g.eF,g.hF,4.8,k.far);
 s+=seg(p.hip,g.kF,8,k.far)+seg(g.kF,g.aF,6.5,k.far)+seg(g.aF,g.tF,4.5,k.far);
 s+=muscleSide(g,ms,k.mu,true);
 s+=(eq.mid0||[]).map(e=>EQ[e[0]](ctx,...e.slice(1))).join('');
 s+=seg(p.hip,g.sh,13,k.ink);
 s+=dotc(g.hd,L.head,k.ink);
 const nose=add(g.hd,mul([g.f*Math.cos(g.t+rad(p.headTilt||0)),Math.sin(g.t+rad(p.headTilt||0))],L.head*0.95));
 s+=dotc(nose,1.8,k.ink);
 s+=seg(p.hip,g.kN,8.5,k.ink)+seg(g.kN,g.aN,7,k.ink)+seg(g.aN,g.tN,5,k.ink);
 s+=(eq.mid||[]).map(e=>EQ[e[0]](ctx,...e.slice(1))).join('');
 s+=seg(g.sh,g.eN,6,k.ink)+seg(g.eN,g.hN,5.2,k.ink);
 s+=muscleSide(g,ms,k.mu,false);
 s+=(eq.front||[]).map(e=>EQ[e[0]](ctx,...e.slice(1))).join('');
 return s;
}

/* ---------- FRONT VIEW ---------- */
// p: {hip:[x,y], torso (len, default 30), lean (deg, + = head toward viewer: shortens torso), handL, handR, ankL, ankR, elbowOut, kneeOut, headDown}
function frontGeom(p){
 const tl=(p.tlen||30), hip=p.hip, neck=[hip[0],hip[1]-tl];
 const shL=[neck[0]-10,neck[1]+2], shR=[neck[0]+10,neck[1]+2], hL=[hip[0]-5.5,hip[1]], hR=[hip[0]+5.5,hip[1]];
 const hd=p.headDown?[neck[0],neck[1]+(p.headDown)]:[neck[0],neck[1]-L.neck-L.head+1];
 const eo=p.elbowOut??1, ko=p.kneeOut??1;
 const g={hip,neck,shL,shR,hL,hR,hd};
 const r=v=>res(v,g);
 g.wL=r(p.handL);g.wR=r(p.handR);g.aL=r(p.ankL);g.aR=r(p.ankR);
 g.eL=ik(shL,g.wL,L.ua,L.fa,eo*-1);g.eR=ik(shR,g.wR,L.ua,L.fa,eo*1);
 g.kL=ik(hL,g.aL,L.th,L.sh,ko*1);g.kR=ik(hR,g.aR,L.th,L.sh,ko*-1);
 return g;
}
function drawFront(p,eq,ms,k){
 const g=frontGeom(p);let s='';const ctx={p,g,k,front:true};
 s+=(eq.back||[]).map(e=>EQ[e[0]](ctx,...e.slice(1))).join('');
 const has=m=>ms.includes(m);
 // legs
 for(const [h,kn,a,sd] of [[g.hL,g.kL,g.aL,-1],[g.hR,g.kR,g.aR,1]]){s+=seg(h,kn,8.5,k.ink)+seg(kn,a,7,k.ink)+seg(a,[a[0]+sd*4,a[1]+1],5,k.ink);
  if(has('quads'))s+=seg(add(h,mul(sub(kn,h),0.15)),add(h,mul(sub(kn,h),0.85)),4,k.mu);}
 // torso as a tapered shape
 const tw=p.headDown?14:0;
 s+=`<path d="M${g.hL[0]-1},${g.hip[1]} L${g.shL[0]+1},${g.shL[1]} L${g.shR[0]-1},${g.shR[1]} L${g.hR[0]+1},${g.hip[1]} Z" fill="${k.ink}" stroke="${k.ink}" stroke-width="7" stroke-linejoin="round"/>`;
 if(has('chest'))s+=`<path d="M${g.neck[0]-8},${g.neck[1]+6} Q${g.neck[0]},${g.neck[1]+12} ${g.neck[0]+8},${g.neck[1]+6}" fill="none" stroke="${k.mu}" stroke-width="4.5" stroke-linecap="round"/>`;
 if(has('back'))s+=seg([g.neck[0]-6,g.neck[1]+5],[g.neck[0]+6,g.neck[1]+5],4.5,k.mu)+seg([g.neck[0]-7,g.neck[1]+12],[g.neck[0]+7,g.neck[1]+12],3.5,k.mu,0.8);
 if(has('abs'))s+=seg([g.hip[0],g.hip[1]-5],[g.hip[0],g.hip[1]-(p.tlen||30)*0.55],5,k.mu);
 // head
 s+=dotc(g.hd,L.head,k.ink);
 // arms
 for(const [shp,e,w] of [[g.shL,g.eL,g.wL],[g.shR,g.eR,g.wR]]){s+=seg(shp,e,6,k.ink)+seg(e,w,5.2,k.ink);
  if(has('shoulders'))s+=dotc(shp,4.6,k.mu);
  if(has('biceps')||has('triceps'))s+=seg(add(shp,mul(sub(e,shp),0.2)),add(shp,mul(sub(e,shp),0.85)),3,k.mu);}
 s+=(eq.front||[]).map(e=>EQ[e[0]](ctx,...e.slice(1))).join('');
 return s;
}

const H=(ctx,which)=>{const g=ctx.g;return which==='F'?g.hF:which==='L'?g.wL:which==='R'?g.wR:(ctx.front?g.wR:g.hN)};
const EQ={
 plate:(ctx,dx=0,dy=0)=>{const h=add(H(ctx),[dx,dy]);return `<circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="9.5" fill="none" stroke="${ctx.k.metal}" stroke-width="3.5"/>${dotc(h,2,ctx.k.metal)}`},
 plateAt:(ctx,ref,dx,dy)=>{const h=add(ctx.g[ref],[dx,dy]);return `<circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="9.5" fill="none" stroke="${ctx.k.metal}" stroke-width="3.5"/>${dotc(h,2,ctx.k.metal)}`},
 db:(ctx,which,vert)=>{const h=H(ctx,which);const k=ctx.k;return vert?`<rect x="${(h[0]-2.6).toFixed(1)}" y="${(h[1]-7).toFixed(1)}" width="5.2" height="14" rx="2" fill="${k.metal}"/>`:`<rect x="${(h[0]-6).toFixed(1)}" y="${(h[1]-3.2).toFixed(1)}" width="12" height="6.4" rx="2.2" fill="${k.metal}"/>`},
 dbFar:(ctx,vert)=>EQ.db(ctx,'F',vert),
 dbF:(ctx,which)=>{const h=H(ctx,which);return `<rect x="${(h[0]-3.5).toFixed(1)}" y="${(h[1]-5).toFixed(1)}" width="7" height="10" rx="2" fill="${ctx.k.metal}"/>`},
 goblet:(ctx)=>{const h=ctx.g.hN;return `<rect x="${(h[0]-3).toFixed(1)}" y="${(h[1]-7).toFixed(1)}" width="6" height="14" rx="2" fill="${ctx.k.metal}"/>`},
 box:(ctx,x,y,w)=>`<rect x="${x}" y="${y}" width="${w}" height="${111-y}" rx="2" fill="none" stroke="${ctx.k.metal}" stroke-width="2"/>`,
 bench:(ctx,x=8,w=66,y=76)=>`<rect x="${x}" y="${y}" width="${w}" height="6" rx="2" fill="${ctx.k.metal}"/>${seg([x+8,y+6],[x+8,111],3,ctx.k.metal)}${seg([x+w-8,y+6],[x+w-8,111],3,ctx.k.metal)}`,
 benchTop:(ctx,x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="none" stroke="${ctx.k.metal}" stroke-width="2"/>`,
 rig:(ctx,x1=40,x2=84,y=9)=>seg([x1,y],[x2,y],3,ctx.k.metal),
 cable:(ctx,x,y)=>{const h=ctx.g.hN;return seg([x,y],h,1.4,ctx.k.metal)+dotc([x,y],3,ctx.k.metal)+`<rect x="${(h[0]-7).toFixed(1)}" y="${(h[1]-1.5).toFixed(1)}" width="14" height="3" rx="1.5" fill="${ctx.k.metal}"/>`},
 seat:(ctx,x,y,w)=>`<rect x="${x}" y="${y}" width="${w}" height="5" rx="2" fill="${ctx.k.metal}"/>${seg([x+w/2,y+5],[x+w/2,111],3,ctx.k.metal)}`,
 pad:(ctx,x,y)=>dotc([x,y],4,ctx.k.metal),
 band:(ctx,x1,y1)=>{const h=ctx.g.hN;return `<path d="M${x1},${y1} Q${((x1+h[0])/2).toFixed(1)},${((y1+h[1])/2+6).toFixed(1)} ${h[0].toFixed(1)},${h[1].toFixed(1)}" fill="none" stroke="${ctx.k.ac}" stroke-width="1.8" opacity="0.7"/>`},
 bandFeet:(ctx)=>{const g=ctx.g;return `<path d="M${g.hN[0]-2},${g.hN[1]} L${g.aN[0]},${g.aN[1]+2}" stroke="${ctx.k.ac}" stroke-width="1.8" opacity="0.7"/>`},
 bandFront:(ctx)=>{const g=ctx.g;return `<path d="M${g.wL[0]},${g.wL[1]} L${g.wR[0]},${g.wR[1]}" stroke="${ctx.k.ac}" stroke-width="2" opacity="0.75"/>`},
 mat:(ctx,x1=10,x2=110)=>seg([x1,109.5],[x2,109.5],3,ctx.k.line),
 treadmill:(ctx)=>`<path d="M14,108 L96,100" stroke="${ctx.k.metal}" stroke-width="4" stroke-linecap="round"/>${seg([92,100],[100,60],3,ctx.k.metal)}${seg([100,60],[88,58],3,ctx.k.metal)}`,
 bike:(ctx)=>{const k=ctx.k;return `<circle cx="70" cy="96" r="11" fill="none" stroke="${k.metal}" stroke-width="2.5"/>${seg([36,70],[50,70],4,k.metal)}${seg([44,72],[58,96],3,k.metal)}${seg([58,96],[70,96],3,k.metal)}${seg([70,96],[82,54],3,k.metal)}${seg([78,54],[90,54],4,k.metal)}${seg([30,108],[90,108],3,k.metal)}`},
 crank:(ctx)=>dotc([58,92],2.5,ctx.k.metal),
 skierg:(ctx)=>{const k=ctx.k;return `<rect x="96" y="6" width="9" height="102" rx="3" fill="none" stroke="${k.metal}" stroke-width="2.5"/>${seg([86,108],[114,108],3,k.metal)}`},
 skicord:(ctx)=>{const g=ctx.g;return seg([98,16],g.hN,1.3,ctx.k.metal)+seg([98,16],g.hF,1.3,ctx.k.metal)},
 benchV:(ctx)=>`<rect x="48" y="28" width="24" height="60" rx="4" fill="none" stroke="${ctx.k.metal}" stroke-width="2.2"/>`,
};

// ---------- main lifts and the weight model ----------
const TYPES={
 db1:{round:5,min:5,jr:2.5,te:5,unit:'lb (one dumbbell)'},

 bbL:{round:5,min:45,jr:10,te:20,unit:'lb total',bar:true},
 bbU:{round:5,min:45,jr:5,te:10,unit:'lb total',bar:true},
 mach:{round:5,min:10,jr:5,te:10,unit:'lb on the stack'},
};
const LIFTS={
 squatDb:{ex:'goblet-box-squat',type:'db1',test:2},
 squatBb:{ex:'back-squat',type:'bbL',test:9},
 benchDb:{ex:'db-bench',type:'db',test:2},
 benchBb:{ex:'bb-bench',type:'bbU',test:9},
 rdlDb:{ex:'db-rdl',type:'db',test:2},
 rdlBb:{ex:'bb-rdl',type:'bbL',test:9},
 press:{ex:'db-shoulder-press',type:'db',test:2},
 row:{ex:'db-row',type:'db',test:2},
 pulldown:{ex:'lat-pulldown',type:'mach',test:2},
};
function liftFor(slot,w){if(slot==='squat')return w<=8?'squatDb':'squatBb';if(slot==='bench')return w<=8?'benchDb':'benchBb';if(slot==='rdl')return w<=8?'rdlDb':'rdlBb';return slot}
const DELOAD=[8,12];
// sets x reps for main lifts by week
function mainRx(w,lift){
 const L=LIFTS[lift];
 if(w===1)return {mode:'learn',sets:2,reps:10};
 if(w===L.test)return {mode:'test',sets:2,reps:8};
 if(DELOAD.includes(w))return {mode:'deload',sets:3,reps:8,pct:0.8};
 if(w===16)return {mode:'retest',sets:2,reps:8};
 if(w<=4)return {mode:'work',sets:3,reps:10};
 if(w<=11)return {mode:'work',sets:4,reps:8};
 if(w<=14)return {mode:'work',sets:4,reps:6};
 return {mode:'work',sets:5,reps:5};
}
// load for target reps, leaving ~2 in reserve, from an 8-rep base (Epley-style estimate)
const repFactor=r=>(1+10/30)/(1+(r+2)/30);
function roundTo(x,t){const T=TYPES[t];let v=Math.round(x/T.round)*T.round;return Math.max(T.min,v)}
// base weight for a lift entering week w, from start + check-ins in earlier weeks
function baseFor(state,lift,w){
 const L=LIFTS[lift],start=(state.starts||{})[lift];if(!start)return null;
 const T=TYPES[L.type];let b=start,prevHard=false;const ci=(state.checkins||{})[lift]||{};
 const weeks=Object.keys(ci).map(Number).filter(x=>x>=L.test&&x<w&&!DELOAD.includes(x)).sort((a,b)=>a-b);
 for(const wk of weeks){const v=ci[wk];
  if(v==='easy'){b+=T.te;prevHard=false}else if(v==='right'){b+=T.jr;prevHard=false}
  else if(v==='hard'){if(prevHard){b=b*0.9;prevHard=false}else prevHard=true}}
 return b;
}
function loadFor(state,lift,w){
 const rx=mainRx(w,lift),L=LIFTS[lift];if(rx.mode==='learn'||rx.mode==='test'||rx.mode==='retest')return null;
 const b=baseFor(state,lift,w);if(b==null)return null;
 let x=b*repFactor(rx.reps);if(rx.pct)x*=rx.pct;return roundTo(x,L.type);
}

function finisher(w){

}

function weekNote(w){
 if(w===1)return 'Welcome. This week is practice. Use light weights, learn each movement, and finish every workout feeling like you could have done more. Open "How to" on any exercise for a diagram and a demo video.';

  else if(!canSwap)h+=`<p class="small" style="margin:6px 0 0">On a main lift, you can also drop to half the weight and see if it still hurts. If it does, stop.</p>`;
  h+='</div>'}
 return h}
function finCard(item,w,d,i){const key=lk(w,d,i);if(S.ease[w+'-'+d])item={...item,t:'Finisher: 8 minutes easy. Light day, so keep it conversational.'};
 return `<section class="ex"><div class="hd"><h3>Finisher</h3><p class="cue" style="color:var(--ink)">${esc(item.t.replace(/^Finisher: /,''))}</p><div style="margin-top:6px">${termBtn(item.term,key)}</div></div>
 <div class="foot">${logFields(key,'finisher','c','','8')}</div></section>`}
function condCard(item,w,d,i){const key=lk(w,d,i);if(S.ease[w+'-'+d]&&item.term!=='easy'&&item.term!=='zone2')item={...item,name:'Easy cardio (light day)',main:'20 minutes at an easy pace',sub:'Light day: skip the intervals today.',term:'easy'};const pk=S.pick[key]||item.pick[0];const pex=LIB[pk];
 return `<section class="ex"><div class="hd"><h3>${esc(item.name)}</h3><p class="rx">${esc(item.main)}</p><p class="cue">${esc(item.sub)}</p><div style="margin-top:6px">${termBtn(item.term,key)}</div>
 <div class="picks" role="group" aria-label="Machine">${item.pick.map(x=>`<button data-act="pick" data-k="${key}" data-v="${x}" aria-pressed="${x===pk}">${esc(LIB[x].name)}</button>`).join('')}</div>
 <p class="cue">${esc(pex.cue)}</p>${howBtn(key,pk)}</div>${UI.open[key]?diagPanel(pk):''}
 <div class="foot">${logFields(key,'cond','c','',(item.main.match(/^(\d+) minutes/)||[])[1]||'')}</div></section>`}
function blockFor(w){return P.BLOCKS.find(b=>b.weeks.includes(w))}
function lastDoneTs(){let m=0;for(const k in S.doneAt)m=Math.max(m,S.doneAt[k]||0);return m}
function gapBanner(){const ld=lastDoneTs();if(!ld)return '';const days=Math.floor((Date.now()-ld)/864e5);if(days<9||S.gapAck===ld)return '';
 return `<div class="note warn"><b>Welcome back.</b> It\u2019s been ${days} days since your last workout. Coming back at full weight after a break is how people get hurt or quit. Pick one:
 <div class="row" style="margin-top:10px"><button class="btn primary" data-act="ease">Make today a light day</button><button class="btn" data-act="repeat">Repeat last week</button><button class="btn" data-act="gapok">I\u2019m fine</button></div></div>`}
function viewWorkout(){
 const w=S.week,days=P.week(w,S.sched);if(S.day>=days.length)S.day=0;
 const b=blockFor(w),wn=P.weekNote(w),dl=P.DELOAD.includes(w);
 let h=`<div class="weeknav"><button class="iconbtn" data-act="wk" data-v="-1" aria-label="Previous week" ${w<=1?'disabled':''}>◀</button>
 <div class="wk"><b>Week ${w} <span style="font-size:13px;letter-spacing:0;text-transform:none">of 16</span></b><span>Block ${b.n} · ${esc(b.name)}${dl?' · Lighter week':''}</span></div>
 <button class="iconbtn" data-act="wk" data-v="1" aria-label="Next week" ${w>=16?'disabled':''}>▶</button></div>
 <select class="wsel" data-act="wsel" aria-label="Jump to a week">${P.BLOCKS.map(bl=>`<optgroup label="Block ${bl.n} · ${esc(bl.name)}">${bl.weeks.map(x=>`<option value="${x}" ${x===w?'selected':''}>Week ${x}${P.DELOAD.includes(x)?' (lighter)':''}${x===16?' (retest)':''}</option>`).join('')}</optgroup>`).join('')}</select>`;
 if(wn)h+=`<div class="note${dl?' warn':''}">${esc(wn)}</div>`;
 h+=`<div class="days" style="grid-template-columns:repeat(${days.length>4?3:days.length},1fr)">${days.map((dy,i)=>`<button data-act="day" data-v="${i}" aria-pressed="${i===S.day}" class="${S.done[w+'-'+i]?'done':''}"><b>Day ${i+1}</b><small>${esc(dy.focus)}</small></button>`).join('')}</div>`;
 h=gapBanner()+h;const dy=days[S.day];const dk0=w+'-'+S.day;
 h+=`<div class="dayhead"><h2>${esc(dy.name)}</h2><p>${esc(dy.focus)}</p></div>`;
 if(S.ease[dk0])h+=`<div class="note"><b>Light day.</b> Main-lift weights are at about 80%, there\u2019s no check-in, and hard intervals become easy. <button class="term" data-act="uneasy">Undo</button></div>`;
 if(dy.items.some(x=>x.kind==='main'))h+=`<div class="card small" style="padding:12px 14px"><b>Warm-up:</b> 5 minutes of easy cardio, then 1–2 light sets of the first exercise. ${termBtn('warmup','wu'+w+S.day)}</div>`;
 dy.items.forEach((it,i)=>{h+=it.kind==='main'?mainCard(it,w,S.day,i):it.kind==='acc'?accCard(it,w,S.day,i):it.kind==='fin'?finCard(it,w,S.day,i):it.kind==='cond'?condCard(it,w,S.day,i):''});
 const dk=w+'-'+S.day;
 h+=`<div class="card small" style="padding:12px 14px"><button class="term" data-act="unwell" aria-expanded="${!!UI.unwell}">Not feeling well today?</button>${UI.unwell?`<div class="termbox"><p style="margin:0 0 6px">${esc(TERMS.sick[1])}</p><p style="margin:0 0 8px">${esc(TERMS.sore[1])}</p>${S.ease[dk]?'<b>Today is already a light day.</b>':'<button class="btn" data-act="ease">Make today a light day</button>'}</div>`:''}</div>`;
 h+=`<div class="donebar"><button class="btn ${S.done[dk]?'':'primary'} block" data-act="done">${S.done[dk]?'✓ Workout done (tap to undo)':'Mark workout done'}</button>
 <button class="btn block" style="margin-top:8px" data-act="copyweek">Copy this week\u2019s summary</button><p class="small muted" style="margin:6px 2px 0">Paste it into a text to a coach or a friend.</p></div>`;
 const nDone=Object.keys(S.done).length;if(nDone>=3&&(!S.lastBackup||Date.now()-S.lastBackup>14*864e5))h+=`<div class="note"><b>Back up your progress.</b> Your logs are saved only on this phone. A backup lets you restore everything on a new phone. <div style="margin-top:8px"><button class="btn primary" data-act="backup">Save a backup</button></div></div>`;

// ---------- progress ----------
function viewProgress(){
 const nd=S.sched===3?3:S.sched===4?4:6;let total=0,done=0;const per=[];
 for(let w=1;w<=16;w++){let c=0;for(let d=0;d<nd;d++){total++;if(S.done[w+'-'+d]){done++;c++}}per.push(c/nd)}
 let h=`<h2 style="margin:16px 0 4px">Progress</h2><div class="card"><div class="row" style="justify-content:space-between"><b>${done} of ${total} workouts done</b><span class="muted small">${nd} days a week</span></div>
 <div class="prog" aria-label="Workouts done by week">${per.map((p,i)=>`<i title="Week ${i+1}"><b style="height:${Math.round(p*100)}%"></b></i>`).join('')}</div><div class="row small muted" style="justify-content:space-between"><span>Week 1</span><span>Week 16</span></div></div>`;
 h+=`<div class="card"><h3 style="margin:0 0 8px;font-size:17px">Main lifts</h3><table><thead><tr><th>Lift</th><th>Start</th><th>Now</th><th>Retest</th></tr></thead><tbody>`;
 const order=['squatDb','benchDb','rdlDb','press','row','pulldown','squatBb','benchBb','rdlBb'];
 order.forEach(l=>{const L=P.LIFTS[l],ex=LIB[L.ex],st=S.starts[l];const now=Math.min(16,Math.max(S.week,L.test+1));const cur=st!=null?P.roundTo(P.baseFor(S,l,now),L.type):null;
  h+=`<tr><td>${esc(ex.name)}<div class="small muted">${esc(unit(l))} · set in Week ${L.test}</div></td><td><input class="num" style="width:76px;padding:6px 8px;font-size:15px" type="number" inputmode="decimal" data-act="start" data-lift="${l}" data-re="0" value="${st!=null?st:''}" aria-label="Starting weight"></td><td>${cur!=null?cur:'—'}</td><td><input class="num" style="width:76px;padding:6px 8px;font-size:15px" type="number" inputmode="decimal" data-act="start" data-lift="${l}" data-re="1" value="${S.retest[l]!=null?S.retest[l]:''}" aria-label="Retest weight"></td></tr>`});
 h+=`</tbody></table><p class="small muted" style="margin:8px 0 0">"Now" is your 8-rep weight after this week’s check-ins. You can correct a starting or retest weight here if you entered it wrong.</p></div>`;
 h+=charts();
 return h;
}
function liftLog(lift){const ex=P.LIFTS[lift].ex,pts={};for(const k in S.sets){const v=S.sets[k];if(v&&v.ex===ex&&+v.w>0){const wk=+k.split('-')[0];pts[wk]=Math.max(pts[wk]||0,+v.w)}}return Object.keys(pts).map(Number).sort((a,b)=>a-b).map(x=>[x,pts[x]])}
function charts(){const order=['squatDb','benchDb','rdlDb','press','row','pulldown','squatBb','benchBb','rdlBb'];let h=`<div class="card"><h3 style="margin:0 0 2px;font-size:17px">Weight you logged</h3><p class="small muted" style="margin:0 0 6px">Main lifts, heaviest weight logged each week. Tap a dot for the number.</p>`;let any=false;
 order.forEach(l=>{const pts=liftLog(l);if(pts.length<1)return;any=true;const L=P.LIFTS[l];const W=320,H=128,pl=34,pr=22,pt=24,pb=22;const xs=[L.test-1||1,16];
  const ys=pts.map(p=>p[1]);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<10){lo=Math.max(0,lo-5);hi=hi+5}const X=x=>pl+(x-xs[0])/(xs[1]-xs[0])*(W-pl-pr),Y=y=>pt+(1-(y-lo)/(hi-lo))*(H-pt-pb);
  const path=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');const lp=pts[pts.length-1];
  h+=`<div style="margin-top:12px"><div style="font-weight:600;font-size:14px">${esc(LIB[L.ex].name)} <span class="muted" style="font-weight:400">${esc(unit(l))}</span></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="${esc(LIB[L.ex].name)}: ${pts.map(p=>'week '+p[0]+' '+p[1]).join(', ')}">
  <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="var(--line)" stroke-width="1"/>
  <text x="${pl-6}" y="${Y(hi)+4}" text-anchor="end" font-size="10" fill="var(--dim)">${Math.round(hi)}</text><text x="${pl-6}" y="${Y(lo)+4}" text-anchor="end" font-size="10" fill="var(--dim)">${Math.round(lo)}</text>
  <text x="${X(xs[0])}" y="${H-6}" font-size="10" fill="var(--dim)">Wk ${xs[0]}</text><text x="${X(16)}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--dim)">Wk 16</text>
  <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map(p=>`<g><circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="12" fill="transparent"><title>Week ${p[0]}: ${p[1]} lb</title></circle><circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2" pointer-events="none"/></g>`).join('')}
  <text x="${Math.min(X(lp[0])+8,W-pr-20)}" y="${Y(lp[1])-8}" font-size="11" font-weight="700" fill="var(--ink)">${lp[1]}</text></svg></div>`});
 if(!any)h+=`<p class="small" style="margin:8px 0 0">Log the weight you use on your main lifts and a chart for each one shows up here.</p>`;
 return h+'</div>'}

const ICONS={workout:'<path d="M4 9v6M20 9v6M7 7v10M17 7v10M7 12h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>',learn:'<path d="M4 5h7a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-7a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h7z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>',progress:'<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',settings:'<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'};
function render(){

 document.getElementById('tabs').innerHTML=[['workout','Workout'],['learn','Learn'],['progress','Progress'],['settings','Settings']].map(([k,t])=>`<button data-act="tab" data-v="${k}" ${S.tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${t}</button>`).join('');

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,v=t.dataset.v;
 if(a==='log'||a==='start'||a==='wsel'||a==='lib')return;
 if(a==='summary'||a==='savewt')return;
 if(a==='tab'){S.tab=v;save();render();window.scrollTo(0,0);return}
 if(a==='wk'){S.week=Math.min(16,Math.max(1,S.week+Number(v)));save();render();return}
 if(a==='day'){S.day=Number(v);save();render();return}
 if(a==='how'){UI.open[t.dataset.k]=!UI.open[t.dataset.k];render();return}
 if(a==='term'){UI.term[t.dataset.k]=!UI.term[t.dataset.k];render();return}
 if(a==='ci'){const l=t.dataset.lift;S.checkins[l]=S.checkins[l]||{};S.checkins[l][S.week]=S.checkins[l][S.week]===v?undefined:v;if(!S.checkins[l][S.week])delete S.checkins[l][S.week];save();render();return}
 if(a==='pick'){S.pick[t.dataset.k]=v;save();render();return}
 if(a==='done'){const k=S.week+'-'+S.day;if(S.done[k]){delete S.done[k];delete S.doneAt[k]}else{S.done[k]=true;S.doneAt[k]=Date.now()}save();render();return}
 if(a==='ease'){S.ease[S.week+'-'+S.day]=true;S.gapAck=lastDoneTs();save();render();return}
 if(a==='uneasy'){delete S.ease[S.week+'-'+S.day];save();render();return}
 if(a==='repeat'){S.gapAck=lastDoneTs();S.week=Math.max(1,S.week-1);S.day=0;save();render();window.scrollTo(0,0);return}
 if(a==='gapok'){S.gapAck=lastDoneTs();save();render();return}
 if(a==='unwell'){UI.unwell=!UI.unwell;render();return}
 if(a==='hurt'){UI.hurt[t.dataset.k]=!UI.hurt[t.dataset.k];render();return}
 if(a==='swapmenu'){UI.swap[t.dataset.k]=!UI.swap[t.dataset.k];render();return}
 if(a==='swap'){S.swaps[t.dataset.from]=v;UI.swap={};UI.hurt={};save();render();toast('Swapped to '+LIB[v].name);return}
 if(a==='unswap'){delete S.swaps[v];save();render();return}
 if(a==='rest'){startTimer(+v);return}

 if(a==='reset'){if(confirm('Erase all your logs, weights and check-ins on this phone? This can’t be undone.')){S={sched:null,week:1,day:0,tab:'workout',logs:{},starts:{},checkins:{},done:{},retest:{},theme:S.theme,pick:{},sets:{},doneAt:{},swaps:{},ease:{}};save();UI.onboard=true;render()}return}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.act==='log'){const v=t.value;if(v)S.logs[t.dataset.k]=v;else delete S.logs[t.dataset.k];save()}
 if(t.dataset.act==='lrs'){const k=t.dataset.k,o=S.sets[k]||{ex:t.dataset.ex};o.ex=t.dataset.ex;const r=repsOf(o).slice();const n=+t.dataset.n;while(r.length<n)r.push('');r[+t.dataset.i]=t.value.trim();o.reps=r;delete o.r;if(!o.w&&!r.some(Boolean))delete S.sets[k];else S.sets[k]=o;save();refreshSuggest(k);return}
 if(t.dataset.act==='lw'||t.dataset.act==='lr'){const k=t.dataset.k,o=S.sets[k]||{ex:t.dataset.ex};o.ex=t.dataset.ex;o[t.dataset.act==='lw'?'w':'r']=t.value.trim();if(!o.w&&!o.r&&!repsOf(o).some(Boolean))delete S.sets[k];else S.sets[k]=o;save()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.act==='start'){const n=parseFloat(t.value);const tgt=t.dataset.re==='1'?S.retest:S.starts;if(isFinite(n)&&n>0)tgt[t.dataset.lift]=n;else delete tgt[t.dataset.lift];save();render()}
 if(t.dataset.act==='wsel'){S.week=Number(t.value);save();render()}
 if(t.dataset.act==='restore'){const f=t.files&&t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>restoreFrom(rd.result);rd.readAsText(f);t.value=''}
});
document.addEventListener('toggle',e=>{const t=e.target;if(t.dataset&&t.dataset.act==='lib'){const k=t.dataset.k;if(!!UI.open[k]!==t.open){UI.open[k]=t.open;render()}}},true);
function refreshSuggest(k){const box=document.querySelector(`[data-ck="${k}"]`);if(!box)return;const lift=box.querySelector('[data-lift]').dataset.lift;if((S.checkins[lift]||{})[S.week])return;
 const sg=suggest(k,box.dataset.target,+box.dataset.n);box.querySelectorAll('[data-act="ci"]').forEach(b=>b.classList.toggle('sg',b.dataset.v===sg));box.querySelector('.sugg').innerHTML=sg?SUGTXT[sg]:''}
function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600)}
let audio;function beep(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();[0,0.25,0.5].forEach(o=>{const os=audio.createOscillator(),g=audio.createGain();os.frequency.value=880;g.gain.setValueAtTime(0.0001,audio.currentTime+o);g.gain.exponentialRampToValueAtTime(0.3,audio.currentTime+o+0.02);g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+o+0.18);os.connect(g);g.connect(audio.destination);os.start(audio.currentTime+o);os.stop(audio.currentTime+o+0.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(sec){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume&&audio.resume()}catch(e){}UI.timer={end:Date.now()+sec*1000,fired:false};tickTimer()}
function stopTimer(){UI.timer=null;tickTimer()}
function tickTimer(){let el=document.getElementById('timer');if(!el){el=document.createElement('div');el.id='timer';el.className='timerbar';document.body.appendChild(el)}
 if(!UI.timer){el.classList.remove('show');el.innerHTML='';return}const left=Math.round((UI.timer.end-Date.now())/1000);
 if(left<=0&&!UI.timer.fired){UI.timer.fired=true;beep()}
 const s=Math.max(0,left),txt=left>0?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:'Go';
 el.classList.add('show');el.classList.toggle('done',left<=0);el.innerHTML=`<span class="tlabel">${left>0?'Rest':'Next set'}</span><b>${txt}</b><button class="btn" data-act="tplus">+30s</button><button class="btn" data-act="tstop">${left>0?'Stop':'Close'}</button>`}
setInterval(()=>{if(UI.timer)tickTimer()},250);
function shareText(txt,msg,clipOnly){if(!clipOnly&&navigator.share){navigator.share({text:txt}).catch(()=>{});return}
 const done=()=>toast(msg);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));else fallbackCopy(txt,done)}
function fallbackCopy(txt,cb){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();cb()}
function weekSummary(w){const days=P.week(w,S.sched);const b=blockFor(w);const L=[`Training Cycle — Week ${w} of 16 (Block ${b.n}: ${b.name})`];
 days.forEach((dy,d)=>{L.push('');L.push(`Day ${d+1} · ${dy.name}${S.done[w+'-'+d]?' ✓ done':' (not done)'}${S.ease[w+'-'+d]?' · light day':''}`);
  dy.items.forEach((it,i)=>{const k=lk(w,d,i),v=S.sets[k],n=S.logs[k];let name,extra='';
   if(it.kind==='main'){const lift=P.liftFor(it.slot,w);name=LIB[P.LIFTS[lift].ex].name;const c=(S.checkins[lift]||{})[w];if(c)extra=' — felt '+({easy:'too easy',right:'just right',hard:'too hard'}[c]);}
   else if(it.kind==='acc')name=LIB[S.swaps[it.ex]||it.ex].name;else if(it.kind==='fin')name='Finisher';else if(it.kind==='cond')name=it.name;else return;
   const r=repsOf(v).filter(Boolean);if(!v&&!n&&!extra)return;
   const unitTxt=it.kind==='fin'||it.kind==='cond'?' min':' lb';L.push(`  ${name}: ${v&&v.w?v.w+unitTxt:''}${r.length?(v&&v.w?' × ':'')+r.join(', '):''}${v&&v.r&&!Array.isArray(v.reps)&&(it.kind==='fin'||it.kind==='cond')?', '+v.r:''}${extra}${n?' ('+n+')':''}`)})});
 return L.join('\n')}
function backupObj(){return {app:'training-cycle',version:1,saved:new Date().toISOString(),state:S}}
function doBackup(){const txt=JSON.stringify(backupObj());const name=`training-cycle-backup-${new Date().toISOString().slice(0,10)}.json`;let file=null;try{file=new File([txt],name,{type:'application/json'})}catch(e){}
 const mark=()=>{S.lastBackup=Date.now();save();render();toast('Backup saved.')};
 if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Training Cycle backup'}).then(mark).catch(()=>{});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);mark()}
function restoreFrom(txt){let o;try{o=JSON.parse(String(txt||'').trim())}catch(e){alert('That doesn’t look like a Training Cycle backup.');return}
 if(!o||o.app!=='training-cycle'||!o.state||typeof o.state!=='object'){alert('That doesn’t look like a Training Cycle backup.');return}
 const n=Object.keys(o.state.done||{}).length;if(!confirm(`Restore this backup from ${o.saved?new Date(o.saved).toLocaleDateString():'an earlier date'}? It has ${n} completed workouts and will replace what’s on this phone now.`))return;
 S=o.state;['logs','starts','checkins','done','retest','pick','sets','doneAt','swaps','ease'].forEach(k=>S[k]=S[k]||{});S.tab='workout';UI.onboard=!S.sched;save();applyTheme();render();toast('Backup restored.')}
function nextWorkout(){const nd=S.sched===3?3:S.sched===4?4:6;let lastIdx=-1;for(let w=1;w<=16;w++)for(let d=0;d<nd;d++)if(S.done[w+'-'+d])lastIdx=Math.max(lastIdx,(w-1)*nd+d);
 if(lastIdx<0)return null;for(let i=lastIdx+1;i<16*nd;i++){const w=Math.floor(i/nd)+1,d=i%nd;if(!S.done[w+'-'+d])return [w,d]}return null}
if(S.sched){const nx=nextWorkout();if(nx){S.week=nx[0];S.day=nx[1];S.tab='workout'}}
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
// animate open diagrams
const rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=0;function tick(ts){if(!rm&&ts-last>40){last=ts;const ph=(ts/2600)%1;document.querySelectorAll('[data-anim]').forEach(el=>{el.innerHTML=D.at(el.dataset.anim,ph)})}requestAnimationFrame(tick)}
requestAnimationFrame(tick);
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());
UI.onboard=!S.sched;
render();
window.__TC={get S(){return S},render,weekSummary,backupObj,restoreFrom,nextWorkout};
})();
